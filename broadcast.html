<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Broadcast Unit - ICC Elite Layout</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Roboto', sans-serif; }
        
        /* --- MAIN APP MODES --- */
        #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #receiver-container { display:none; position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index: 999; }
        
        /* HIDDEN VIDEO SOURCE (Phone Camera) */
        #video-source { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 0; 
            opacity: 0; 
        }
        
        /* BROADCAST CANVAS */
        #broadcast-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 2; 
        }

        /* HUD CONTROLS */
        #controls-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none;
        }
        .hud-item { pointer-events: auto; }

        /* GEAR BUTTON */
        #gear-button {
            position: absolute; top: 25px; left: 25px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px);
            transition: transform 0.3s ease, background 0.3s;
            z-index: 100;
        }
        #gear-button:hover { background: rgba(0,0,0,0.8); transform: rotate(90deg); }

        /* REC BUTTON */
        #rec-button {
            position: absolute; top: 25px; right: 25px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px; border-radius: 50px; color: white;
            font-size: 14px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s;
        }
        
        #rec-indicator { width: 12px; height: 12px; background: #ef4444; border-radius: 50%; transition: all 0.3s; }
        
        /* Recording Active State */
        .recording { background: rgba(220, 38, 38, 0.9) !important; border-color: #ef4444 !important; }
        .recording #rec-indicator { 
            background: white; 
            border-radius: 2px; /* Square for Stop */
            animation: none; 
        }

        /* SETUP SCREEN */
        #setup-screen { position: absolute; inset: 0; z-index: 60; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-field { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fbbf24; font-size: 4rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; width: 320px; padding: 1rem; border-radius: 1rem; outline: none; transition: all 0.3s; font-family: 'Anton', sans-serif; margin-bottom: 2rem; }
        .start-btn { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; border: none; padding: 1rem 4rem; border-radius: 50px; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3); text-transform: uppercase; }
        
        /* MODALS */
        .help-modal { position: absolute; inset: 0; z-index: 70; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
        .modal-card { background: #1e1e1e; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #333; color: white; position: relative; }
        
        .url-box { background: #000; color: #4ade80; font-family: 'Roboto Mono', monospace; padding: 15px; border-radius: 8px; word-break: break-all; margin: 15px 0; border: 1px solid #333; font-size: 0.9rem; }

        /* RECEIVER VIDEO */
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <audio id="audio-four" src="four.mp3" preload="auto"></audio>
    <audio id="audio-six" src="six.mp3" preload="auto"></audio>
    <audio id="audio-wicket" src="wicket.mp3" preload="auto"></audio>

    <div id="setup-screen">
        <h1 style="font-family: 'Anton'; font-size: 3rem; color: white; margin-bottom: 0.5rem; letter-spacing: 2px;">BROADCAST UNIT</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; font-family: 'Roboto';">Enter Match Code</p>
        <input type="text" id="match-id" class="input-field" placeholder="0000" maxlength="4" inputmode="numeric">
        <button onclick="connectToMatch()" class="start-btn">Start Camera</button>
    </div>

    <div id="app-container" style="display: none;">
        <div id="controls-layer">
            <div id="gear-button" class="hud-item" onclick="showObsModal()">⚙️</div>
            
            <div id="rec-button" class="hud-item" onclick="toggleRecording()">
                <div id="rec-indicator"></div> 
                <span id="rec-text">REC</span>
            </div>
        </div>
        
        <video id="video-source" autoplay playsinline muted></video>
        <canvas id="broadcast-canvas"></canvas>
    </div>

    <div id="receiver-container">
        <video id="remote-video" autoplay playsinline controls></video>
        <div style="position:absolute; top:20px; left:20px; color:white; font-family:sans-serif; background:rgba(0,0,0,0.5); padding:10px;">RECEIVER MODE</div>
    </div>

    <div id="obs-modal" class="help-modal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-family: 'Anton'; font-size: 24px; margin-bottom: 15px; color: white;">WIRELESS OBS LINK</h2>
            <p style="margin-bottom:10px; color:#ccc;">Create a direct link to OBS.</p>
            
            <button onclick="startWirelessStream()" id="btn-start-stream" style="width:100%; padding:15px; margin-bottom:15px; background:#2563eb; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">GENERATE CONNECTION CODE</button>

            <div id="obs-instructions" style="display:none; text-align:left;">
                <p style="color:#999; font-size:0.9rem;">Copy this URL into <b>OBS Browser Source</b>:</p>
                <div id="obs-url-display" class="url-box">Generating...</div>
                <button onclick="copyObsUrl()" style="width:100%; padding:10px; background:#333; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">COPY URL</button>
            </div>

            <button onclick="closeObsModal()" style="width:100%; padding:12px; border-radius:8px; border:1px solid #444; background:transparent; color:#ccc; font-weight:bold; margin-top:15px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = { apiKey: "AIzaSyBqcD59IAPpKqk98oDZkgzgkoVZ8b8LGgY", authDomain: "livecricketscoring-92087.firebaseapp.com", databaseURL: "https://livecricketscoring-92087-default-rtdb.firebaseio.com", projectId: "livecricketscoring-92087", storageBucket: "livecricketscoring-92087.firebasestorage.app", messagingSenderId: "522927197627", appId: "1:522927197627:web:f1df5db736cae96893089e" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GLOBAL STATE ---
        // Updated Match Object to include new fields needed for new layout
        let match = { t1: "HOME", t2: "AWAY", score: 0, wickets: 0, overs: 0, balls: 0, striker: { name: "", runs: 0, balls: 0 }, nonStriker: { name: "", runs: 0, balls: 0 }, bowler: { name: "", wkts: 0, runs: 0, balls: 0 }, currentOver: [], target: 0, totalOvers: 20, matchStatus: "", winner: "", margin: "", pom: null, showDismissalCard: false, showSummaryOverlay: false };
        let team1Logo = null, team2Logo = null;
        let lastActionId = null, animType = null, animTime = 0;
        
        const video = document.getElementById('video-source');
        const canvas = document.getElementById('broadcast-canvas');
        const ctx = canvas.getContext('2d');
        let recorder, chunks = [], isRecording = false;

        // --- PEER JS (Wireless) ---
        let peer = null;
        let myPeerId = null;

        // --- INITIALIZATION ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            
            // CHECK: IS THIS OBS? (Receiver Mode)
            if(params.has('obs')) {
                initReceiverMode(params.get('obs'));
                return; // Stop normal camera loading
            }

            // Normal Camera Mode
            if(params.has('id')) { document.getElementById('match-id').value = params.get('id'); }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        function connectToMatch() {
            const id = document.getElementById('match-id').value;
            if(!id) return alert("Please enter Match ID");
            
            // Unlock Audio
            try { ['audio-four','audio-six','audio-wicket'].forEach(id => document.getElementById(id).load()); } catch(e){}

            const constraints = { video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true };
            
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                video.srcObject = stream;
                video.play();
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                resizeCanvas();
                requestAnimationFrame(renderLoop);
                listenToDB(id);
            }).catch(e => alert("Camera Error: " + e.message));
        }

        // --- WIRELESS OBS LOGIC ---

        // 1. SENDER (Camera)
        function showObsModal() { document.getElementById('obs-modal').style.display = 'flex'; }
        function closeObsModal() { document.getElementById('obs-modal').style.display = 'none'; }

        function startWirelessStream() {
            if(peer) return; // Already running
            
            // Create random 4-digit code
            const code = Math.floor(1000 + Math.random() * 9000);
            myPeerId = "match-cam-" + code;
            
            peer = new Peer(myPeerId);
            
            peer.on('open', (id) => {
                const baseUrl = window.location.href.split('?')[0];
                const fullUrl = `${baseUrl}?obs=${myPeerId}`;
                
                document.getElementById('btn-start-stream').style.display = 'none';
                document.getElementById('obs-instructions').style.display = 'block';
                document.getElementById('obs-url-display').innerText = fullUrl;
                
                // Prepare Stream
                const stream = canvas.captureStream(60);
                if(video.srcObject) {
                    const audioTracks = video.srcObject.getAudioTracks();
                    if(audioTracks.length > 0) stream.addTrack(audioTracks[0]);
                }

                // Answer Calls
                peer.on('call', (call) => {
                    console.log("OBS Connected!");
                    call.answer(stream);
                });
            });
        }

        function copyObsUrl() {
            const txt = document.getElementById('obs-url-display').innerText;
            navigator.clipboard.writeText(txt).then(() => alert("URL Copied!"));
        }

        // 2. RECEIVER (OBS)
        function initReceiverMode(targetId) {
            console.log("Starting Receiver Mode for: " + targetId);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('receiver-container').style.display = 'block';
            
            const peer = new Peer(); // Auto-gen ID for receiver
            peer.on('open', (id) => {
                console.log("Receiver Peer ID: " + id);
                const conn = peer.connect(targetId);
                
                // Call the camera
                const call = peer.call(targetId, new MediaStream());
                
                call.on('stream', (remoteStream) => {
                    const vid = document.getElementById('remote-video');
                    vid.srcObject = remoteStream;
                    vid.play();
                });
                
                call.on('error', (err) => console.error("Call Error", err));
            });
        }


        // --- DATABASE LISTENER ---
        function listenToDB(id) {
            db.collection("live_matches").doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    match = { ...match, ...data };
                    if(data.t1Logo && (!team1Logo || team1Logo.src !== data.t1Logo)) { team1Logo = new Image(); team1Logo.src = data.t1Logo; }
                    if(data.t2Logo && (!team2Logo || team2Logo.src !== data.t2Logo)) { team2Logo = new Image(); team2Logo.src = data.t2Logo; }
                    if (data.lastAction && data.lastAction.id !== lastActionId) { 
                        lastActionId = data.lastAction.id; 
                        triggerAnim(data.lastAction.type); 
                    }
                }
            });
        }

        function triggerAnim(type) {
            animType = type; animTime = Date.now();
            const audioId = type === '4' ? 'audio-four' : type === '6' ? 'audio-six' : type === 'W' ? 'audio-wicket' : null;
            if (audioId) {
                const audio = document.getElementById(audioId);
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio autoplay blocked"));
            }
        }

        // --- RENDER LOOP ---
        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            // 1. Draw Video Layer (Specific to Broadcast App)
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const vidRatio = video.videoWidth / video.videoHeight;
                const screenRatio = w / h;
                let drawW, drawH, drawX, drawY;
                if (screenRatio > vidRatio) {
                    drawW = w; drawH = w / vidRatio; drawX = 0; drawY = (h - drawH) / 2;
                } else {
                    drawW = h * vidRatio; drawH = h; drawX = (w - drawW) / 2; drawY = 0;
                }
                ctx.drawImage(video, drawX, drawY, drawW, drawH);
            }

            // 2. Draw Graphics Layer (Using NEW Layout Functions)
            if (match.showDismissalCard === true && match.dismissalData) {
                drawDismissalCard(ctx, w, h);
            } 
            else if (match.matchStatus === "COMPLETE" || match.showSummaryOverlay === true) {
                drawProfessionalSummary(ctx, w, h);
            } 
            else {
                drawNewLayout(ctx, w, h); // UPDATED CALL
                drawPopups(ctx, w, h);
            }
            
            requestAnimationFrame(renderLoop);
        }

        // --- NEW GRAPHICS FUNCTIONS (From OBS Layout) ---
        
        function formatTeamName(name) { 
            if (!name) return "TEAM"; 
            let formatted = name.toUpperCase(); 
            formatted = formatted.replace(/\bCRICKET CLUB\b/g, "C.C");
            formatted = formatted.replace(/\bCRICKET\b/g, "C.C");
            formatted = formatted.replace(/\bCC\b/g, "C.C");
            return formatted; 
        }

        function formatPlayerName(fullName) { 
            if (!fullName) return ""; 
            const parts = fullName.trim().split(/\s+/);
            if (parts.length > 1) {
                return (parts[0] + " " + parts[1].charAt(0) + ".").toUpperCase();
            }
            return parts[0].toUpperCase(); 
        }

        function drawRoundRect(c, x, y, w, h, r) { if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2; c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
        function drawLogo(c, name, img, x, y, s, isLeft) { c.save(); c.beginPath(); c.arc(x + s/2, y + s/2, s/2, 0, Math.PI*2); c.fillStyle = "white"; c.fill(); c.clip(); if(img) c.drawImage(img, x, y, s, s); else { c.fillStyle = "#334155"; c.fillRect(x, y, s, s); c.fillStyle = "white"; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `bold ${s*0.5}px 'Roboto'`; c.fillText(name.substring(0,2), x+s/2, y+s/2); } c.restore(); }
        
        function fitText(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) { 
            let fontSize = initialFontSize; 
            c.font = `${weight} ${fontSize}px '${fontFace}'`; 
            let width = c.measureText(text).width; 
            while (width > maxWidth && fontSize > (initialFontSize * 0.5)) { 
                fontSize -= 2; 
                c.font = `${weight} ${fontSize}px '${fontFace}'`; 
                width = c.measureText(text).width; 
            } 
            c.fillText(text, x, y); 
        }

        function drawBallSquare(c, b, x, y, size) { 
            let txt = b.toString(); 
            let bgColor = "#ffffff"; 
            let txtColor = "#000000"; 

            if (txt === '4') { bgColor = "#0ea5e9"; txtColor = "white"; } 
            else if (txt === '6') { bgColor = "#22c55e"; txtColor = "white"; } 
            else if (txt.includes('W') && !txt.includes('WD')) { bgColor = "#dc2626"; txtColor = "white"; } 
            else if (txt === '0' || txt === '•') { txt = "•"; bgColor = "white"; txtColor = "black"; } 
            else { bgColor = "white"; txtColor = "black"; } 

            c.save();
            c.fillStyle = bgColor;
            c.fillRect(x, y, size, size);

            if (txt === "•") { 
                c.fillStyle = "black";
                c.beginPath();
                c.arc(x + size/2, y + size/2, size * 0.18, 0, Math.PI * 2);
                c.fill();
            } else { 
                c.fillStyle = txtColor;
                c.textAlign = "center";
                c.textBaseline = "middle";
                if (txt.includes('+') || txt.length > 2) {
                     c.font = `900 ${size * 0.45}px 'Roboto Condensed'`; 
                } else {
                     c.font = `900 ${size * 0.7}px 'Roboto Condensed'`; 
                }
                c.fillText(txt, x + size/2, y + size/2 + (size * 0.05)); 
            }
            c.restore(); 
        }

        function drawPopups(c, w, h) { if (!animType) return; const now = Date.now(); if (now - animTime > 3000) { animType = null; return; } c.save(); const startX = w * 0.05; const startY = h - (h * 0.13) - (h * 0.06); c.translate(startX, startY); const t = (now - animTime) / 300; const scale = t < 1 ? (Math.sin(t * Math.PI/2) * 1.1) : 1.0; c.scale(scale, scale); c.textAlign = "left"; c.textBaseline = "bottom"; const fontSize = h * 0.08; c.font = `400 ${fontSize}px 'Anton'`; if (animType === '4') { c.fillStyle = "#3b82f6"; c.fillText("FOUR RUNS", 0, 0); } else if (animType === '6') { c.fillStyle = "#22c55e"; c.fillText("SIX RUNS", 0, 0); } else if (animType === 'W') { c.fillStyle = "#ef4444"; c.fillText("WICKET", 0, 0); } c.restore(); }

        // --- MAIN RENDERER (New Layout) ---
        function drawNewLayout(c, w, h) {
            // SLIMMER LAYOUT
            const barH = h * 0.095; 
            const marginX = w * 0.03; 
            const bottomY = h - barH - (h * 0.03); 
            const pillW = w - (marginX * 2); 
            const pillX = marginX;
            
            const isChasing = (match.target && match.target > 0);

            // 1. Gold Top Line (SLIMMER)
            c.fillStyle = "#fbbf24";
            const goldH = barH * 0.04; 
            c.fillRect(pillX, bottomY - goldH - 2, pillW, goldH);

            // 2. Main Navy Background
            c.save(); 
            c.fillStyle = "#05081c"; 
            c.shadowColor = "rgba(0,0,0,0.5)"; c.shadowBlur = 10; 
            drawRoundRect(c, pillX, bottomY, pillW, barH, 16); 
            c.fill();
            c.clip();
            c.restore();

            // --- GRID CALCULATIONS ---
            let x1 = pillX;
            let x2 = pillX + (pillW * 0.19);
            let x3 = pillX + (pillW * 0.30);
            let x4 = pillX + (pillW * 0.58);
            let x5 = pillX + (pillW * 0.81);
            
            // Variables for 2nd Innings Target Mode
            let xToWinStart = 0;
            let xToWinEnd = 0;
            let bowlStart = x4;
            let bowlEnd = x5;

            if (isChasing) {
                x2 = pillX + (pillW * 0.19);
                x3 = pillX + (pillW * 0.30);
                x4 = pillX + (pillW * 0.53); 
                
                xToWinStart = x4;
                xToWinEnd = pillX + (pillW * 0.63); 
                
                bowlStart = xToWinEnd;
                bowlEnd = pillX + (pillW * 0.81); 
                x5 = bowlEnd;
            }

            // --- DRAW DIVIDERS (BRIGHTER WHITE) ---
            const drawDiv = (x) => {
                c.beginPath(); c.moveTo(x, bottomY + 5); c.lineTo(x, bottomY + barH - 5);
                c.strokeStyle = "rgba(255,255,255,0.8)"; c.lineWidth = 1.5; c.stroke();
            };
            drawDiv(x2); drawDiv(x3); drawDiv(x4); 
            
            if(isChasing) { 
                drawDiv(xToWinEnd); 
                drawDiv(bowlEnd);
            } else { 
                drawDiv(x5); 
            }

            const xEnd = pillX + pillW;

            // --- SECTION 1: BATTING TEAM ---
            const logoS = barH * 0.7;
            drawLogo(c, match.t1, team1Logo, x1 + 15, bottomY + (barH - logoS)/2, logoS, true);
            
            c.fillStyle = "white"; c.textAlign = "left";
            fitText(c, formatTeamName(match.t1), x1 + 25 + logoS, bottomY + barH * 0.45, (x2 - x1) - logoS - 35, barH * 0.35, '700', 'Roboto Condensed');
            
            if (isChasing) {
                c.fillStyle = "#fbbf24"; 
                c.font = `900 ${barH * 0.25}px 'Roboto Condensed'`; 
                c.fillText(`TARGET ${match.target}`, x1 + 25 + logoS, bottomY + barH * 0.75);
            } else {
                c.fillStyle = "#64748b"; c.font = `700 ${barH * 0.16}px 'Roboto'`;
                c.fillText("BATTING", x1 + 25 + logoS, bottomY + barH * 0.70);
            }

            // --- SECTION 2: SCORE ---
            const scoreCenter = x2 + (x3 - x2)/2;
            c.textAlign = "center";
            c.fillStyle = "#fbbf24"; c.font = `900 ${barH * 0.55}px 'Anton'`;
            c.fillText(`${match.score}/${match.wickets}`, scoreCenter, bottomY + barH * 0.60);
            
            c.fillStyle = "white"; 
            c.font = `700 ${barH * 0.18}px 'Apple SD Gothic Neo', 'Roboto'`; 
            c.fillText(`OVERS ${match.overs}.${match.balls}`, scoreCenter, bottomY + barH * 0.85);


            // --- SECTION 3: BATTERS ---
            c.beginPath(); c.moveTo(x3 + 10, bottomY + barH/2); c.lineTo(x4 - 10, bottomY + barH/2);
            c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 1; c.stroke(); 

            const batPad = 20;
            // STRIKER
            c.beginPath(); c.moveTo(x3 + 15, bottomY + barH * 0.25); c.lineTo(x3 + 22, bottomY + barH * 0.30); c.lineTo(x3 + 15, bottomY + barH * 0.35); c.fillStyle = "#fbbf24"; c.fill();
            
            c.textAlign = "left"; c.fillStyle = "white"; 
            c.font = `500 ${barH * 0.28}px 'Apple SD Gothic Neo', 'Roboto Condensed'`; 
            c.fillText(match.striker.name ? formatPlayerName(match.striker.name) : "STRIKER", x3 + 30, bottomY + barH * 0.38);
            
            c.textAlign = "right"; c.font = `900 ${barH * 0.35}px 'Roboto Condensed'`;
            c.fillText(match.striker.runs||0, x4 - batPad - 40, bottomY + barH * 0.40);
            c.font = `400 ${barH * 0.2}px 'Roboto'`; c.fillText(`(${match.striker.balls||0})`, x4 - batPad, bottomY + barH * 0.38);

            // NON-STRIKER
            c.textAlign = "left"; c.fillStyle = "white"; 
            c.font = `500 ${barH * 0.28}px 'Apple SD Gothic Neo', 'Roboto Condensed'`;
            c.fillText(match.nonStriker.name ? formatPlayerName(match.nonStriker.name) : "NON-STRIKER", x3 + 30, bottomY + barH * 0.88);
            
            c.textAlign = "right"; c.font = `900 ${barH * 0.35}px 'Roboto Condensed'`;
            c.fillText(match.nonStriker.runs||0, x4 - batPad - 40, bottomY + barH * 0.90);
            c.font = `400 ${barH * 0.2}px 'Roboto'`; c.fillText(`(${match.nonStriker.balls||0})`, x4 - batPad, bottomY + barH * 0.88);


            // --- SECTION 4: "TO WIN" BOX (DARKER GRADIENT) ---
            if (isChasing) {
                const boxW = xToWinEnd - xToWinStart;
                const runsNeeded = Math.max(0, match.target - match.score);
                const totalBalls = match.totalOvers * 6;
                const ballsBowled = (match.overs * 6) + match.balls;
                const ballsRem = Math.max(0, totalBalls - ballsBowled);
                
                const crr = ballsBowled > 0 ? (match.score / (ballsBowled/6)).toFixed(1) : "0.0";
                const rrr = ballsRem > 0 ? (runsNeeded / (ballsRem/6)).toFixed(1) : "-";

                c.save();
                
                // DARKER horizontal gradient
                const winGrad = c.createLinearGradient(xToWinStart, bottomY, xToWinEnd, bottomY);
                winGrad.addColorStop(0, "#1565c0"); // Deep Blue
                winGrad.addColorStop(1, "#0d47a1"); // Darker Navy Blue
                
                c.fillStyle = winGrad; 
                c.fillRect(xToWinStart, bottomY, boxW, barH);

                const boxCenter = xToWinStart + boxW/2;

                c.textAlign = "center";
                // TO WIN LABEL
                c.fillStyle = "#dbeafe"; 
                c.font = `700 ${barH * 0.16}px 'Roboto Condensed'`;
                c.fillText("TO WIN", boxCenter, bottomY + barH * 0.20);
                
                // ENLARGED TARGET SCORE
                c.fillStyle = "white"; 
                c.font = `900 ${barH * 0.52}px 'Anton'`; 
                c.fillText(`${runsNeeded} - ${ballsRem}`, boxCenter, bottomY + barH * 0.71); 
                
                // ENLARGED RR/CRR
                c.fillStyle = "white"; 
                c.font = `700 ${barH * 0.19}px 'Roboto Condensed'`; 
                c.fillText(`RR: ${rrr}   CRR: ${crr}`, boxCenter, bottomY + barH * 0.92); 
                c.restore();
            }

            // --- SECTION 5: BOWLER & BALLS ---
            c.beginPath(); c.moveTo(bowlStart + 10, bottomY + barH/2); c.lineTo(bowlEnd - 10, bottomY + barH/2);
            c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 1; c.stroke();

            const bowlPad = 20;
            const bName = match.bowler.name ? formatPlayerName(match.bowler.name) : "BOWLER";
            const bFigs = `${match.bowler.wkts || 0}-${match.bowler.runs || 0} (${match.bowler.balls ? (Math.floor(match.bowler.balls/6) + '.' + (match.bowler.balls%6)) : "0.0"})`;

            c.textAlign = "right"; c.fillStyle = "white"; c.font = `700 ${barH * 0.30}px 'Roboto Condensed'`;
            c.fillText(bName, bowlEnd - bowlPad, bottomY + barH * 0.38);
            c.textAlign = "left"; c.fillStyle = "#cbd5e1"; c.font = `400 ${barH * 0.22}px 'Roboto'`;
            c.fillText(bFigs, bowlStart + bowlPad, bottomY + barH * 0.38);

            const balls = match.currentOver || [];
            const ballGap = 5;
            let ballSize = barH * 0.32;
            const maxBallSectionW = (ballSize + ballGap) * 6;
            
            if (balls.length > 6) {
                ballSize = (maxBallSectionW - (ballGap * (balls.length - 1))) / balls.length;
            }

            const ballY = bottomY + barH * 0.58;
            let ballX = bowlEnd - bowlPad - ballSize;
            const ballsToDraw = [...balls].reverse(); 

            ballsToDraw.forEach(b => {
                drawBallSquare(c, b, ballX, ballY, ballSize);
                ballX -= (ballSize + ballGap); 
            });

            // --- SECTION 6: BOWLING TEAM ---
            const finalDiv = isChasing ? bowlEnd : x5; 
            
            drawLogo(c, match.t2, team2Logo, xEnd - 15 - logoS, bottomY + (barH - logoS)/2, logoS, false);
            c.fillStyle = "white"; c.textAlign = "right";
            fitText(c, formatTeamName(match.t2), xEnd - 25 - logoS, bottomY + barH * 0.45, (xEnd - finalDiv) - logoS - 35, barH * 0.35, '700', 'Roboto Condensed');
            c.fillStyle = "#64748b"; c.font = `700 ${barH * 0.16}px 'Roboto'`;
            c.fillText("BOWLING", xEnd - 25 - logoS, bottomY + barH * 0.70);
        }

        // --- DRAW: PROFESSIONAL SUMMARY ---
        function drawProfessionalSummary(c, w, h) {
            const cardW = w * 0.82; const cardH = h * 0.72; const x = (w - cardW) / 2; const y = (h - cardH) / 2 + (h * 0.05);
            const headerH = cardH * 0.18; const footerH = cardH * 0.13; const time = Date.now() * 0.0015;

            c.save(); c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 60; c.shadowOffsetY = 20;
            const bgGrad = c.createLinearGradient(x, y, x, y + cardH); bgGrad.addColorStop(0, "#020617"); bgGrad.addColorStop(1, "#1e1b4b");   
            c.fillStyle = bgGrad; drawRoundRect(c, x, y, cardW, cardH, 20); c.fill();
            const borderGrad = c.createLinearGradient(x, y, x + cardW, y + cardH); borderGrad.addColorStop(0, `hsl(${(time * 30) % 360}, 70%, 50%)`); borderGrad.addColorStop(0.5, "#22d3ee"); borderGrad.addColorStop(1, `hsl(${(time * 30 + 180) % 360}, 70%, 50%)`);
            c.lineWidth = 4; c.strokeStyle = borderGrad; c.stroke(); c.shadowColor = "transparent";

            const logoSize = headerH * 0.9; const logoX = x + 30; const logoY = y + (headerH - logoSize) / 2; 
            c.save(); c.beginPath(); c.moveTo(x + 20, y); c.lineTo(x + cardW - 20, y); c.quadraticCurveTo(x + cardW, y, x + cardW, y + 20); c.lineTo(x + cardW, y + headerH); c.lineTo(x, y + headerH); c.lineTo(x, y + 20); c.quadraticCurveTo(x, y, x + 20, y); c.clip();
            const hGrad = c.createLinearGradient(x, y, x, y + headerH); hGrad.addColorStop(0, "rgba(56, 189, 248, 0.2)"); hGrad.addColorStop(1, "rgba(56, 189, 248, 0.0)"); c.fillStyle = hGrad; c.fill();
            c.beginPath(); c.moveTo(x, y+headerH); c.lineTo(x+cardW, y+headerH); c.strokeStyle = "rgba(255,255,255,0.15)"; c.lineWidth = 2; c.stroke(); c.restore();

            drawLogo(c, match.t1, team1Logo, logoX, logoY, logoSize, true);
            const textX = logoX + logoSize + 30; const maxTextW = cardW - (textX - x) - 40; 
            c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "white"; c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 4; c.shadowOffsetY = 2;
            fitText(c, (match.t1 || "TEAM NAME").toUpperCase(), textX, y + headerH * 0.55, maxTextW, cardH * 0.08, '900', 'Roboto Condensed');
            c.fillStyle = "#7dd3fc"; c.font = `700 ${cardH * 0.03}px 'Roboto'`; c.shadowBlur = 0; c.shadowOffsetY = 0; const subTitle = (match.summaryType === "BOWLING") ? "BOWLING CARD" : "ICC CHAMPIONS TROPHY"; c.fillText(subTitle, textX, y + headerH * 0.85);

            const startY = y + headerH + (cardH * 0.05); c.fillStyle = "#94a3b8"; c.font = `bold ${cardH * 0.028}px 'Roboto'`; c.textAlign = "left";
            let dataList = [];
            if (match.summaryType === "BOWLING") {
                const colX = { name: x + 40, o: x + cardW * 0.55, m: x + cardW * 0.65, r: x + cardW * 0.75, w: x + cardW * 0.85, e: x + cardW * 0.95 };
                c.fillText("BOWLER", colX.name, startY); c.textAlign = "right"; c.fillText("O", colX.o, startY); c.fillText("M", colX.m, startY); c.fillText("R", colX.r, startY); c.fillText("W", colX.w, startY); c.fillText("ECON", colX.e, startY);
                dataList = match.bowlingCard || []; renderRows(c, dataList, startY, cardW, cardH, x, colX, "BOWLING");
            } else {
                const colX = { name: x + 40, dismissal: x + cardW * 0.45, runs: x + cardW * 0.80, balls: x + cardW * 0.95 };
                c.fillText("BATTER", colX.name, startY); c.fillText("DISMISSAL", colX.dismissal, startY); c.textAlign = "right"; c.fillText("RUNS", colX.runs, startY); c.fillText("BALLS", colX.balls, startY);
                dataList = match.battingCard || []; renderRows(c, dataList, startY, cardW, cardH, x, colX, "BATTING");
            }
            const footerY = y + cardH - footerH; c.save(); c.beginPath(); c.moveTo(x, footerY); c.lineTo(x + cardW, footerY); c.lineTo(x + cardW, y + cardH - 20); c.quadraticCurveTo(x + cardW, y + cardH, x + cardW - 20, y + cardH); c.lineTo(x + 20, y + cardH); c.quadraticCurveTo(x, y + cardH, x, y + cardH - 20); c.closePath(); c.clip();
            const fGrad = c.createLinearGradient(x, footerY, x, y + cardH); fGrad.addColorStop(0, "#f1f5f9"); fGrad.addColorStop(1, "#cbd5e1"); c.fillStyle = fGrad; c.fill(); c.restore();
            const fTextY = footerY + (footerH * 0.65); c.fillStyle = "#0f172a"; c.textBaseline = "alphabetic"; c.textAlign = "left"; c.font = `bold ${cardH * 0.035}px 'Roboto'`; c.fillText("EXTRAS " + (match.extras || 0), x + 40, fTextY);
            c.textAlign = "center"; c.fillText("OVERS " + match.overs + "." + match.balls, x + cardW/2, fTextY); c.textAlign = "right"; const scoreFont = `900 ${cardH * 0.075}px 'Roboto Condensed'`; const scoreText = match.score + "-" + match.wickets; c.font = scoreFont; const scoreWidth = c.measureText(scoreText).width; c.fillText(scoreText, x + cardW - 40, fTextY); c.font = `bold ${cardH * 0.035}px 'Roboto'`; c.fillText("TOTAL", x + cardW - 40 - scoreWidth - 20, fTextY); c.restore();
        }

        function renderRows(c, list, startY, cardW, cardH, x, colX, mode) {
            let currentY = startY + (cardH * 0.04); const rowH = cardH * 0.09; c.save(); c.beginPath(); c.rect(x, currentY, cardW, cardH * 0.55); c.clip(); 
            list.forEach((p, i) => {
                const rowY = currentY; const textY = rowY + (rowH * 0.65); let isActive = false; if (mode === "BATTING" && p.status.includes("NOT OUT")) isActive = true;
                if (isActive) { const activeGrad = c.createLinearGradient(x, rowY, x + cardW, rowY); activeGrad.addColorStop(0, "#0ea5e9"); activeGrad.addColorStop(1, "#0284c7"); c.fillStyle = activeGrad; } else { c.fillStyle = (i % 2 === 0) ? "rgba(255,255,255,0.05)" : "transparent"; } c.fillRect(x, rowY, cardW, rowH);
                c.fillStyle = isActive ? "white" : (mode === "BATTING" && !isActive ? "#94a3b8" : "white"); c.textAlign = "left"; c.font = `700 ${cardH * 0.045}px 'Roboto Condensed'`; c.fillText(p.name.toUpperCase(), colX.name, textY);
                if (mode === "BOWLING") { c.textAlign = "right"; c.font = `500 ${cardH * 0.045}px 'Roboto'`; c.fillText(p.o, colX.o, textY); c.fillText(p.m, colX.m, textY); c.fillText(p.r, colX.r, textY); c.font = `900 ${cardH * 0.05}px 'Roboto'`; c.fillText(p.w, colX.w, textY); c.font = `500 ${cardH * 0.045}px 'Roboto'`; c.fillText(p.e, colX.e, textY); } 
                else { c.font = `500 ${cardH * 0.03}px 'Roboto'`; if (isActive) { c.fillStyle = "rgba(255,255,255,0.9)"; c.fillText("NOT OUT", colX.dismissal, textY); } else { c.fillStyle = "#94a3b8"; c.fillText(p.status.toLowerCase(), colX.dismissal, textY); } c.textAlign = "right"; c.font = `900 ${cardH * 0.055}px 'Roboto'`; c.fillStyle = "white"; c.fillText(p.runs, colX.runs, textY); c.font = `500 ${cardH * 0.035}px 'Roboto'`; c.fillStyle = isActive ? "white" : "#94a3b8"; c.fillText(p.balls, colX.balls, textY); } currentY += rowH;
            }); c.restore();
        }

        // --- DRAW: DISMISSAL CARD ---
        function drawDismissalCard(c, w, h) {
            const d = match.dismissalData; if(!d) return; const cardW = w * 0.85; const cardH = h * 0.22; const x = (w - cardW) / 2; const y = h - cardH - (h * 0.1);
            c.save(); c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 30; c.shadowOffsetY = 15; const bgGrad = c.createLinearGradient(x, y, x + cardW, y); bgGrad.addColorStop(0, "#000000"); bgGrad.addColorStop(0.2, "#001233"); bgGrad.addColorStop(0.8, "#001233"); bgGrad.addColorStop(1, "#000000"); c.fillStyle = bgGrad; drawRoundRect(c, x, y, cardW, cardH, 20); c.fill(); c.shadowColor = "transparent";
            const logoSize = cardH * 0.85; const logoX = x + 40; const logoY = y + (cardH - logoSize) / 2; c.fillStyle = "white"; c.beginPath(); c.arc(logoX + logoSize/2, logoY + logoSize/2, logoSize/2, 0, Math.PI*2); c.fill(); c.fillStyle = "#e2e8f0"; c.beginPath(); c.arc(logoX + logoSize/2, logoY + logoSize/2, logoSize/2 - 4, 0, Math.PI*2); c.fill(); drawLogo(c, "TM", team1Logo, logoX + 4, logoY + 4, logoSize - 8, true);
            const nameParts = d.name.split(" "); let firstName = ""; let lastName = d.name; if(nameParts.length > 1) { lastName = nameParts.pop(); firstName = nameParts.join(" "); } const textX = logoX + logoSize + 40; const nameY = y + (cardH * 0.45); c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "white"; c.font = `400 ${cardH * 0.35}px 'Roboto'`; c.fillText(firstName.toUpperCase(), textX, nameY); const firstW = c.measureText(firstName.toUpperCase() + " ").width; c.font = `900 ${cardH * 0.35}px 'Roboto'`; c.fillText(lastName.toUpperCase(), textX + (firstName ? firstW : 0), nameY); c.fillStyle = "#94a3b8"; c.font = `500 ${cardH * 0.15}px 'Roboto'`; c.fillText(d.howOut, textX, y + (cardH * 0.7));
            const boxH = cardH * 0.7; const boxW = boxH * 1.8; const boxX = x + cardW - boxW - 30; const boxY = y + (cardH - boxH) / 2; c.save(); const boxGrad = c.createLinearGradient(boxX, boxY, boxX, boxY + boxH); boxGrad.addColorStop(0, "#3b82f6"); boxGrad.addColorStop(1, "#0f172a"); c.fillStyle = boxGrad; c.strokeStyle = "#cbd5e1"; c.lineWidth = 4; drawRoundRect(c, boxX, boxY, boxW, boxH, 15); c.fill(); c.stroke(); c.fillStyle = "white"; c.textAlign = "center"; c.font = `900 ${boxH * 0.6}px 'Anton'`; c.fillText(d.score, boxX + boxW/2, boxY + boxH * 0.55); c.font = `500 ${boxH * 0.2}px 'Roboto'`; c.fillText(`OFF ${d.balls}`, boxX + boxW/2, boxY + boxH * 0.85); c.restore(); c.restore();
        }

        // --- RECORDING ---
        function toggleRecording() {
            const btn = document.getElementById('rec-button');
            const dot = document.getElementById('rec-indicator');
            const txt = document.getElementById('rec-text');
            
            if(isRecording) {
                recorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                dot.style.borderRadius = "50%";
                txt.innerText = "REC";
            } else {
                const stream = canvas.captureStream(60); 
                if(video.srcObject) { const audioTracks = video.srcObject.getAudioTracks(); if(audioTracks.length > 0) stream.addTrack(audioTracks[0]); }
                let options = { mimeType: 'video/webm;codecs=vp9' };
                if(!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
                try { recorder = new MediaRecorder(stream, options); } catch(e) { recorder = new MediaRecorder(stream); }
                chunks = []; recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
                recorder.onstop = saveVideo; recorder.start();
                isRecording = true;
                btn.classList.add('recording');
                dot.style.borderRadius = "2px";
                txt.innerText = "STOP";
            }
        }
        function saveVideo() {
            const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Match_Rec_${Date.now()}.webm`; 
            document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }
    </script>
