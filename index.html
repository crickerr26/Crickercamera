<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Broadcast Unit</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000; overflow: hidden; font-family: 'Roboto', sans-serif; }
        #app-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        #video-source { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #broadcast-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }

        /* HUD ELEMENTS */
        #status-pill {
            position: absolute; top: 25px; left: 25px; z-index: 10;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            padding: 4px 12px; border-radius: 4px;
            color: white; font-size: 14px; font-weight: 900; letter-spacing: 1px;
            font-family: 'Roboto', sans-serif;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }
        .live-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1.5s infinite; }

        #rec-button {
            position: absolute; top: 25px; right: 25px; z-index: 10;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px; border-radius: 50px; color: white;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s;
        }
        #rec-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        .recording { background: rgba(220, 38, 38, 0.9) !important; border-color: #ef4444 !important; }
        .recording #rec-dot { animation: pulse 1s infinite; background: white; }

        #setup-screen { position: absolute; inset: 0; z-index: 50; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-field { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #60a5fa; font-size: 4rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; width: 320px; padding: 1rem; border-radius: 1rem; outline: none; transition: all 0.3s; font-family: 'Teko', sans-serif; margin-bottom: 2rem; }
        .start-btn { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 1rem 4rem; border-radius: 50px; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3); text-transform: uppercase; }
        
        #portrait-warning { position: fixed; inset: 0; z-index: 100; background: #000; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .rotate-icon { font-size: 4rem; margin-bottom: 1rem; color: #3b82f6; animation: rotatePhone 2s infinite; }
        @media (orientation: portrait) { #portrait-warning { display: flex !important; } #app-container { display: none; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.8); } 100% { transform: scale(1); } }
        @keyframes rotatePhone { 0%, 10% { transform: rotate(0deg); } 40%, 60% { transform: rotate(-90deg); } 90%, 100% { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div id="portrait-warning"><div class="rotate-icon">⟳</div><h2 style="font-family: 'Teko'; font-size: 2.5rem; text-transform: uppercase;">Rotate Device</h2><p style="color: #64748b; font-family: 'Roboto';">Broadcast mode requires landscape view.</p></div>

    <div id="setup-screen">
        <h1 style="font-family: 'Teko'; font-size: 3rem; color: white; margin-bottom: 0.5rem; letter-spacing: 2px;">BROADCAST UNIT</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px;">Enter Match ID</p>
        <input type="text" id="match-id" class="input-field" placeholder="0000" maxlength="4" inputmode="numeric">
        <button onclick="connectToMatch()" class="start-btn">Start Camera</button>
    </div>

    <div id="app-container" style="display: none;">
        <div id="status-pill"><div class="live-dot"></div> LIVE</div>
        <div id="rec-button" onclick="toggleRecording()"><div id="rec-dot"></div> REC</div>
        <video id="video-source" autoplay playsinline muted></video>
        <canvas id="broadcast-canvas"></canvas>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBqcD59IAPpKqk98oDZkgzgkoVZ8b8LGgY", authDomain: "livecricketscoring-92087.firebaseapp.com", databaseURL: "https://livecricketscoring-92087-default-rtdb.firebaseio.com", projectId: "livecricketscoring-92087", storageBucket: "livecricketscoring-92087.firebasestorage.app", messagingSenderId: "522927197627", appId: "1:522927197627:web:f1df5db736cae96893089e" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let match = { t1: "", t2: "", score: 0, wickets: 0, overs: 0, balls: 0, striker: { name: "", runs: 0, balls: 0 }, nonStriker: { name: "", runs: 0, balls: 0 }, bowler: { name: "", wkts: 0, runs: 0, balls: 0 }, currentOver: [], target: 0, totalOvers: 0 };
        let team1Logo = null, team2Logo = null;
        let lastActionId = null, animType = null, animTime = 0;
        
        const video = document.getElementById('video-source');
        const canvas = document.getElementById('broadcast-canvas');
        const ctx = canvas.getContext('2d');
        let recorder, chunks = [], isRecording = false;

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('id')) { document.getElementById('match-id').value = params.get('id'); connectToMatch(); }
            window.addEventListener('resize', resizeCanvas);
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        function connectToMatch() {
            const id = document.getElementById('match-id').value;
            if(!id) return alert("Please enter Match ID");
            const constraints = { video: { facingMode: "environment", width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: true };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                video.srcObject = stream;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                resizeCanvas();
                requestAnimationFrame(renderLoop);
                listenToDB(id);
            }).catch(e => alert("Camera Error: " + e.message));
        }

        function listenToDB(id) {
            db.collection("live_matches").doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    match = data;
                    if(data.t1Logo && (!team1Logo || team1Logo.src !== data.t1Logo)) { team1Logo = new Image(); team1Logo.src = data.t1Logo; }
                    if(data.t2Logo && (!team2Logo || team2Logo.src !== data.t2Logo)) { team2Logo = new Image(); team2Logo.src = data.t2Logo; }
                    if (data.lastAction && data.lastAction.id !== lastActionId) { lastActionId = data.lastAction.id; triggerAnim(data.lastAction.type); }
                }
            });
        }

        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            ctx.clearRect(0, 0, w, h);
            drawICCScoreboard(ctx, w, h);
            drawPopups(ctx, w, h);
            requestAnimationFrame(renderLoop);
        }

        // --- NAME FORMATTING HELPER (Imzamam Rizan -> Imzamam R.) ---
        function formatPlayerName(fullName) {
            if (!fullName) return "";
            const parts = fullName.trim().split(" ");
            if (parts.length === 1) return parts[0]; // "Imzamam" -> "Imzamam"
            
            // "Imzamam Rizan" -> parts[0] + " " + parts[last][0] + "."
            // Using the last part for the initial handles middle names correctly
            const firstName = parts[0];
            const lastInitial = parts[parts.length - 1].charAt(0);
            return `${firstName} ${lastInitial}.`;
        }

        // --- FIXED STRICT GRID LAYOUT ---
        function drawICCScoreboard(c, w, h) {
            const barH = h * 0.14; 
            const marginX = w * 0.02; 
            const bottomY = h - barH - (h * 0.05);
            const pillW = w - (marginX * 2);
            const pillX = marginX;

            // Background
            c.save();
            const grad = c.createLinearGradient(pillX, bottomY, pillX + pillW, bottomY);
            grad.addColorStop(0, "rgba(8, 12, 35, 0.98)"); 
            grad.addColorStop(0.5, "rgba(15, 23, 50, 0.98)"); 
            grad.addColorStop(1, "rgba(8, 12, 35, 0.98)");
            c.shadowColor = "rgba(0,0,0,0.5)"; c.shadowBlur = 10;
            drawRoundRect(c, pillX, bottomY, pillW, barH, 8);
            c.fillStyle = grad; c.fill();
            c.beginPath(); c.moveTo(pillX + 20, bottomY); c.lineTo(pillX + pillW - 20, bottomY);
            c.lineWidth = 4; c.strokeStyle = "#fbbf24"; c.stroke();
            c.restore();

            // --- GRID ZONES ---
            const zoneLeftEnd = pillX + (pillW * 0.25);   // Team 1 end
            const zoneScoreStart = pillX + (pillW * 0.42); // Score start
            const zoneScoreEnd = pillX + (pillW * 0.58);   // Score end
            const zoneRightStart = pillX + (pillW * 0.75); // Team 2 start

            const logoS = barH * 0.65;
            const logoY = bottomY + (barH - logoS) / 2;

            // 1. TEAM 1 (Left)
            drawLogo(c, match.t1, team1Logo, pillX + 15, logoY, logoS, true);
            const t1NameX = pillX + 20 + logoS;
            const t1MaxW = (zoneLeftEnd - t1NameX) - 5; 
            c.textAlign = "left"; c.textBaseline = "middle"; c.fillStyle = "white";
            fitText(c, match.t1.toUpperCase(), t1NameX, bottomY + barH * 0.4, t1MaxW, barH * 0.25, '700', 'Teko');
            c.fillStyle = "#64748b"; c.font = `500 ${barH * 0.14}px 'Roboto'`; c.fillText("BATTING", t1NameX, bottomY + barH * 0.75);
            drawDivider(c, zoneLeftEnd, bottomY + barH*0.2, barH*0.6);

            // 2. TEAM 2 (Right)
            drawLogo(c, match.t2, team2Logo, pillX + pillW - 15 - logoS, logoY, logoS, false);
            const t2NameX = pillX + pillW - 20 - logoS;
            const t2MaxW = (t2NameX - zoneRightStart) - 5;
            c.textAlign = "right"; c.fillStyle = "white";
            fitText(c, match.t2.toUpperCase(), t2NameX, bottomY + barH * 0.4, t2MaxW, barH * 0.25, '700', 'Teko');
            c.fillStyle = "#64748b"; c.font = `500 ${barH * 0.14}px 'Roboto'`; c.fillText("BOWLING", t2NameX, bottomY + barH * 0.75);
            drawDivider(c, zoneRightStart, bottomY + barH*0.2, barH*0.6);

            // 3. CENTER SCORE (Locked in middle)
            const centerX = pillX + (pillW / 2);
            c.textAlign = "center";
            
            // Score
            c.fillStyle = "white"; c.font = `700 ${barH * 0.55}px 'Teko'`;
            c.fillText(`${match.score}/${match.wickets}`, centerX, bottomY + barH * 0.55);
            
            // Overs
            c.fillStyle = "#94a3b8"; c.font = `500 ${barH*0.16}px 'Roboto'`;
            c.fillText(`OVERS ${match.overs}.${match.balls}`, centerX, bottomY + barH * 0.85);

            // TARGET (Shows if Target > 0)
            if(match.target > 0) {
                 c.fillStyle = "#fbbf24"; c.font = `700 ${barH*0.16}px 'Roboto'`;
                 c.fillText(`TARGET: ${match.target}`, centerX, bottomY + barH * 0.2);
            }

            // 4. BATSMEN (Left of Score)
            const batStartX = zoneLeftEnd + (pillW * 0.02);
            const batMaxW = (zoneScoreStart - batStartX) - 10;
            c.textAlign = "left"; 
            
            // Striker (Formatted)
            c.fillStyle = "white"; 
            fitText(c, `► ${formatPlayerName(match.striker.name)}`, batStartX, bottomY + barH * 0.45, batMaxW * 0.7, barH*0.22, '700', 'Roboto');
            c.fillStyle = "#fbbf24"; c.font = `700 ${barH*0.22}px 'Roboto'`;
            c.fillText(`${match.striker.runs}(${match.striker.balls})`, batStartX + (batMaxW * 0.75), bottomY + barH * 0.45);

            // Non-Striker (Formatted)
            c.fillStyle = "#94a3b8"; 
            fitText(c, formatPlayerName(match.nonStriker.name), batStartX, bottomY + barH * 0.75, batMaxW * 0.7, barH*0.18, '500', 'Roboto');
            c.fillText(`${match.nonStriker.runs}(${match.nonStriker.balls})`, batStartX + (batMaxW * 0.75), bottomY + barH * 0.75);

            // 5. BOWLER (Right of Score)
            const bowlEndX = zoneRightStart - (pillW * 0.02);
            const bowlMaxW = (bowlEndX - zoneScoreEnd) - 10;
            c.textAlign = "right";
            
            // Name (Formatted)
            c.fillStyle = "white"; 
            fitTextAlignRight(c, formatPlayerName(match.bowler.name), bowlEndX, bottomY + barH * 0.35, bowlMaxW, barH*0.22, '700', 'Roboto');
            
            // Figures
            const bBalls = match.bowler.balls !== undefined ? match.bowler.balls : 0;
            c.fillStyle = "#fbbf24"; c.font = `500 ${barH*0.16}px 'Roboto'`;
            c.fillText(`${match.bowler.wkts}-${match.bowler.runs} (${bBalls})`, bowlEndX, bottomY + barH * 0.55);

            // 6. BUBBLES (Under Bowler Name - Inside the bar)
            const bubbleR = barH * 0.12; 
            const bubbleY = bottomY + barH * 0.8; // Bottom row
            let bx = bowlEndX - bubbleR; 

            if (match.currentOver && Array.isArray(match.currentOver)) {
                const last5 = match.currentOver.slice(-5).reverse();
                c.textAlign = "center"; c.textBaseline = "middle";
                
                last5.forEach(b => {
                    let txt = b.toString();
                    let upper = txt.toUpperCase(); 
                    
                    let bgColor = "#f1f5f9"; let txtColor = "#0f172a"; 
                    let fontSize = bubbleR * 0.9;

                    if (txt === '4') { bgColor = "#3b82f6"; txtColor = "white"; }
                    else if (txt === '6') { bgColor = "#22c55e"; txtColor = "white"; }
                    else if (upper === 'W' || upper === 'OUT') { bgColor = "#ef4444"; txtColor = "white"; }
                    else if (upper.includes('WD') || upper.includes('NB')) { 
                        bgColor = "#fbbf24"; txtColor = "black"; fontSize = bubbleR * 0.6;
                    }

                    c.beginPath(); c.arc(bx, bubbleY, bubbleR, 0, Math.PI * 2); 
                    c.fillStyle = bgColor; c.fill();
                    c.fillStyle = txtColor; c.font = `700 ${fontSize}px 'Roboto'`; 
                    c.fillText(txt, bx, bubbleY);
                    
                    bx -= (bubbleR * 2.2); 
                });
                c.textBaseline = "alphabetic";
            }
        }

        // --- HELPER: Right Align Fit ---
        function fitTextAlignRight(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) {
            let fontSize = initialFontSize;
            c.font = `${weight} ${fontSize}px '${fontFace}'`;
            let width = c.measureText(text).width;
            while (width > maxWidth && fontSize > (initialFontSize * 0.6)) {
                fontSize -= 2;
                c.font = `${weight} ${fontSize}px '${fontFace}'`;
                width = c.measureText(text).width;
            }
            if (width > maxWidth) {
                while (width > maxWidth && text.length > 0) { text = text.slice(0, -1); width = c.measureText(text + "...").width; }
                text += "...";
            }
            c.fillText(text, x, y);
        }

        function fitText(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) {
            let fontSize = initialFontSize;
            c.font = `${weight} ${fontSize}px '${fontFace}'`;
            let width = c.measureText(text).width;
            while (width > maxWidth && fontSize > (initialFontSize * 0.6)) {
                fontSize -= 2;
                c.font = `${weight} ${fontSize}px '${fontFace}'`;
                width = c.measureText(text).width;
            }
            if (width > maxWidth) {
                while (width > maxWidth && text.length > 0) { text = text.slice(0, -1); width = c.measureText(text + "...").width; }
                text += "...";
            }
            c.fillText(text, x, y);
        }

        // --- ANIMATIONS ---
        function triggerAnim(type) { animType = type; animTime = Date.now(); }
        function drawPopups(c, w, h) {
            if (!animType) return;
            const now = Date.now(); 
            if (now - animTime > 3000) { animType = null; return; }
            
            c.save();
            const startX = w * 0.05; 
            const startY = h - (h * 0.16) - (h * 0.06); 
            c.translate(startX, startY);
            
            const t = (now - animTime) / 300; 
            const scale = t < 1 ? (Math.sin(t * Math.PI/2) * 1.1) : 1.0;
            c.scale(scale, scale);
            
            c.textAlign = "left"; c.textBaseline = "bottom"; 
            const fontSize = h * 0.08; 
            c.font = `900 ${fontSize}px 'Teko'`;
            
            if (animType === '4') { c.fillStyle = "#3b82f6"; c.fillText("FOUR RUNS", 0, 0); }
            else if (animType === '6') { c.fillStyle = "#22c55e"; c.fillText("SIX RUNS", 0, 0); }
            else if (animType === 'W') { c.fillStyle = "#ef4444"; c.fillText("WICKET", 0, 0); }
            
            c.restore();
        }

        function drawDivider(c, x, y, h) {
            c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + h);
            c.strokeStyle = "rgba(255,255,255,0.15)"; c.lineWidth = 1; c.stroke();
        }

        function drawLogo(c, name, img, x, y, s, isLeft) {
            c.save(); c.beginPath(); c.arc(x + s/2, y + s/2, s/2, 0, Math.PI*2); c.fillStyle = "white"; c.fill(); c.clip();
            if(img) { c.drawImage(img, x, y, s, s); } 
            else { c.fillStyle = isLeft ? "#059669" : "#dc2626"; c.fillRect(x, y, s, s); c.fillStyle = "white"; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `bold ${s*0.5}px 'Roboto'`; c.fillText(name ? name.substring(0,2) : "", x+s/2, y+s/2); }
            c.restore();
        }

        function drawRoundRect(c, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
            c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
        }

        function toggleRecording() {
            if(isRecording) { recorder.stop(); isRecording = false; document.getElementById('rec-button').classList.remove('recording'); }
            else {
                const stream = canvas.captureStream(60); 
                if(video.srcObject) { const audioTracks = video.srcObject.getAudioTracks(); if(audioTracks.length > 0) stream.addTrack(audioTracks[0]); }
                let options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 };
                if(!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
                recorder = new MediaRecorder(stream, options);
                chunks = []; recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
                recorder.onstop = saveVideo; recorder.start();
                isRecording = true; document.getElementById('rec-button').classList.add('recording');
            }
        }
        function saveVideo() {
            const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `ICC_Broadcast_${Date.now()}.webm`; document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }
    </script>
</body>
</html>
