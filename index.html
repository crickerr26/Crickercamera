<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Pro Broadcast Unit - Vertical Elite</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- LOCK SCROLLING & VERTICAL MODE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; /* No scrolling */
            background: #000; 
            font-family: 'Roboto', sans-serif;
            touch-action: none; /* Disables browser gestures like swipe to refresh */
            overscroll-behavior: none; /* Disables rubber-banding */
        }
        
        /* --- LAYOUT LAYERS --- */
        #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #receiver-container { display:none; position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index: 999; }
        
        /* HIDDEN SOURCE VIDEO */
        #video-source { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 0; opacity: 0; pointer-events: none;
        }
        
        /* BROADCAST CANVAS (The Output) */
        #broadcast-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: contain; /* Ensures we see the whole high-res frame */
            z-index: 2; 
        }

        /* HUD CONTROLS LAYER (Visible to user, NOT recorded) */
        #controls-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none;
        }
        .hud-item { pointer-events: auto; }

        /* QUALITY BADGE (New) */
        #quality-badge {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 4px;
            color: #4ade80; /* Green text */
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            z-index: 90;
            display: none; /* Hidden until stream starts */
        }

        /* GEAR BUTTON */
        #gear-button {
            position: absolute; top: 25px; left: 25px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px);
            transition: transform 0.3s ease, background 0.3s;
            z-index: 100;
        }
        #gear-button:hover { background: rgba(0,0,0,0.8); transform: rotate(90deg); }

        /* REC BUTTON */
        #rec-button {
            position: absolute; top: 25px; right: 25px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px; border-radius: 50px; color: white;
            font-size: 14px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s;
            z-index: 100;
        }
        #rec-indicator { width: 12px; height: 12px; background: #ef4444; border-radius: 50%; transition: all 0.3s; }
        .recording { background: rgba(220, 38, 38, 0.9) !important; border-color: #ef4444 !important; }
        .recording #rec-indicator { background: white; border-radius: 2px; animation: none; }

        /* ZOOM SLIDER */
        #zoom-container {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            height: 200px; width: 50px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.3); border-radius: 25px;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s; display: none; z-index: 100;
        }
        input[type=range][orient=vertical] {
            writing-mode: bt-lr; -webkit-appearance: slider-vertical;
            width: 8px; height: 140px; padding: 0 5px; background: transparent; cursor: pointer;
        }
        .zoom-btn { color: white; font-size: 18px; font-weight: bold; cursor: pointer; padding: 10px; opacity: 0.8; }
        .zoom-btn:active { transform: scale(0.9); opacity: 1; }

        /* SETUP SCREEN */
        #setup-screen { position: absolute; inset: 0; z-index: 60; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-field { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fbbf24; font-size: 4rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; width: 320px; padding: 1rem; border-radius: 1rem; outline: none; transition: all 0.3s; font-family: 'Anton', sans-serif; margin-bottom: 2rem; }
        .start-btn { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; border: none; padding: 1rem 4rem; border-radius: 50px; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3); text-transform: uppercase; }
        
        /* MODALS */
        .help-modal { position: absolute; inset: 0; z-index: 70; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
        .modal-card { background: #1e1e1e; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #333; color: white; position: relative; }
        .url-box { background: #000; color: #4ade80; font-family: 'Roboto Mono', monospace; padding: 15px; border-radius: 8px; word-break: break-all; margin: 15px 0; border: 1px solid #333; font-size: 0.9rem; }
        #receiver-video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <audio id="audio-four" src="four.mp3" preload="auto"></audio>
    <audio id="audio-six" src="six.mp3" preload="auto"></audio>
    <audio id="audio-wicket" src="wicket.mp3" preload="auto"></audio>

    <div id="setup-screen">
        <h1 style="font-family: 'Anton'; font-size: 3rem; color: white; margin-bottom: 0.5rem; letter-spacing: 2px;">VERTICAL UNIT</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; font-family: 'Roboto';">Enter Match Code</p>
        <input type="text" id="match-id" class="input-field" placeholder="0000" maxlength="4" inputmode="numeric">
        <button onclick="connectToMatch()" class="start-btn">GO LIVE</button>
    </div>

    <div id="app-container" style="display: none;">
        <div id="controls-layer">
            <div id="quality-badge">DETECTING...</div>

            <div id="gear-button" class="hud-item" onclick="showObsModal()">⚙️</div>
            
            <div id="rec-button" class="hud-item" onclick="toggleRecording()">
                <div id="rec-indicator"></div> 
                <span id="rec-text">REC</span>
            </div>

            <div id="zoom-container" class="hud-item">
                <div class="zoom-btn" onclick="stepZoom(1)">+</div>
                <input type="range" id="zoom-slider" orient="vertical" min="1" max="10" step="0.1" value="1" oninput="applyZoom(this.value)">
                <div class="zoom-btn" onclick="stepZoom(-1)">-</div>
            </div>
        </div>
        
        <video id="video-source" autoplay playsinline muted></video>
        <canvas id="broadcast-canvas"></canvas>
    </div>

    <div id="receiver-container">
        <video id="remote-video" autoplay playsinline controls></video>
        <div style="position:absolute; top:20px; left:20px; color:white; font-family:sans-serif; background:rgba(0,0,0,0.5); padding:10px;">RECEIVER MODE</div>
    </div>

    <div id="obs-modal" class="help-modal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-family: 'Anton'; font-size: 24px; margin-bottom: 15px; color: white;">WIRELESS OBS LINK</h2>
            <p style="margin-bottom:10px; color:#ccc;">Create a direct link to OBS.</p>
            <button onclick="startWirelessStream()" id="btn-start-stream" style="width:100%; padding:15px; margin-bottom:15px; background:#2563eb; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">GENERATE CONNECTION CODE</button>
            <div id="obs-instructions" style="display:none; text-align:left;">
                <p style="color:#999; font-size:0.9rem;">Copy this URL into <b>OBS Browser Source</b>:</p>
                <div id="obs-url-display" class="url-box">Generating...</div>
                <button onclick="copyObsUrl()" style="width:100%; padding:10px; background:#333; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">COPY URL</button>
            </div>
            <button onclick="closeObsModal()" style="width:100%; padding:12px; border-radius:8px; border:1px solid #444; background:transparent; color:#ccc; font-weight:bold; margin-top:15px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = { apiKey: "AIzaSyBqcD59IAPpKqk98oDZkgzgkoVZ8b8LGgY", authDomain: "livecricketscoring-92087.firebaseapp.com", databaseURL: "https://livecricketscoring-92087-default-rtdb.firebaseio.com", projectId: "livecricketscoring-92087", storageBucket: "livecricketscoring-92087.firebasestorage.app", messagingSenderId: "522927197627", appId: "1:522927197627:web:f1df5db736cae96893089e" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GLOBAL STATE ---
        let match = { t1: "HOME", t2: "AWAY", score: 0, wickets: 0, overs: 0, balls: 0, striker: { name: "", runs: 0, balls: 0 }, nonStriker: { name: "", runs: 0, balls: 0 }, bowler: { name: "", wkts: 0, runs: 0, balls: 0 }, currentOver: [], target: 0, totalOvers: 20, matchStatus: "", winner: "", margin: "", pom: null, showDismissalCard: false, showSummaryOverlay: false };
        let team1Logo = null, team2Logo = null;
        let lastActionId = null, animType = null, animTime = 0;
        
        const video = document.getElementById('video-source');
        const canvas = document.getElementById('broadcast-canvas');
        const ctx = canvas.getContext('2d');
        let recorder, chunks = [], isRecording = false;
        let videoTrack = null;
        let zoomCapabilities = null;

        // --- PEER JS ---
        let peer = null;
        let myPeerId = null;

        // --- INITIALIZATION ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('obs')) { initReceiverMode(params.get('obs')); return; }
            if(params.has('id')) { document.getElementById('match-id').value = params.get('id'); }
        };

        async function getSafeStream(attempts) {
            for (const constraints of attempts) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    return stream; 
                } catch (e) {
                    console.warn("Retrying lower quality...", e);
                }
            }
            throw new Error("Could not start camera.");
        }

        function connectToMatch() {
            const id = document.getElementById('match-id').value;
            if(!id) return alert("Please enter Match ID");
            try { ['audio-four','audio-six','audio-wicket'].forEach(id => document.getElementById(id).load()); } catch(e){}

            // 1. LOCK VERTICAL MODE
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("portrait").catch(e => console.log("Orientation lock not supported"));
            }

            // 2. REQUEST VERTICAL RESOLUTIONS (Height > Width)
            const qualityAttempts = [
                // 4K Vertical
                { video: { facingMode: "environment", width: { ideal: 2160 }, height: { ideal: 3840 }, frameRate: { ideal: 60 } }, audio: true },
                // 1080p Vertical
                { video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 60 } }, audio: true },
                // Fallback
                { video: { facingMode: "environment" }, audio: true }
            ];
            
            getSafeStream(qualityAttempts).then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    
                    // 3. FORCE CANVAS TO NATIVE CAMERA RESOLUTION (Fix for "Shrinking Quality")
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Update Quality Badge
                    const badge = document.getElementById('quality-badge');
                    const is4K = video.videoHeight > 3000 || video.videoWidth > 3000;
                    const fps = videoTrack ? videoTrack.getSettings().frameRate : 30;
                    badge.innerText = `REC QUALITY: ${video.videoWidth}x${video.videoHeight} ${(is4K ? '(4K)' : '')} @${Math.round(fps||30)}fps`;
                    badge.style.display = "block";
                    
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'block';
                    
                    requestAnimationFrame(renderLoop);
                };

                // Zoom Logic
                videoTrack = stream.getVideoTracks()[0];
                const capabilities = videoTrack.getCapabilities();
                if ('zoom' in capabilities) {
                    zoomCapabilities = capabilities.zoom;
                    const slider = document.getElementById('zoom-slider');
                    const container = document.getElementById('zoom-container');
                    slider.min = zoomCapabilities.min;
                    slider.max = zoomCapabilities.max;
                    slider.step = 0.1;
                    slider.value = zoomCapabilities.min;
                    container.style.display = 'flex';
                }
                listenToDB(id);
            }).catch(e => alert("Camera Error: " + e.message));
        }

        // --- ZOOM ---
        function applyZoom(val) {
            if (!videoTrack) return;
            videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }).catch(e => {});
        }
        function stepZoom(dir) {
            const slider = document.getElementById('zoom-slider');
            let v = parseFloat(slider.value) + dir;
            if(v > parseFloat(slider.max)) v = parseFloat(slider.max);
            if(v < parseFloat(slider.min)) v = parseFloat(slider.min);
            slider.value = v; applyZoom(v);
        }

        // --- WIRELESS OBS ---
        function showObsModal() { document.getElementById('obs-modal').style.display = 'flex'; }
        function closeObsModal() { document.getElementById('obs-modal').style.display = 'none'; }
        function startWirelessStream() {
            if(peer) return; 
            const code = Math.floor(1000 + Math.random() * 9000);
            myPeerId = "match-cam-" + code;
            peer = new Peer(myPeerId);
            peer.on('open', (id) => {
                const fullUrl = `${window.location.href.split('?')[0]}?obs=${myPeerId}`;
                document.getElementById('btn-start-stream').style.display = 'none';
                document.getElementById('obs-instructions').style.display = 'block';
                document.getElementById('obs-url-display').innerText = fullUrl;
                
                const stream = canvas.captureStream(30); // Lower FPS for wireless to prevent lag
                if(video.srcObject) { const audioTracks = video.srcObject.getAudioTracks(); if(audioTracks.length > 0) stream.addTrack(audioTracks[0]); }
                peer.on('call', (call) => { call.answer(stream); });
            });
        }
        function copyObsUrl() { navigator.clipboard.writeText(document.getElementById('obs-url-display').innerText).then(() => alert("Copied!")); }
        function initReceiverMode(targetId) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('receiver-container').style.display = 'block';
            const peer = new Peer();
            peer.on('open', () => {
                const call = peer.call(targetId, new MediaStream());
                call.on('stream', (rs) => { document.getElementById('remote-video').srcObject = rs; document.getElementById('remote-video').play(); });
            });
        }

        // --- DATABASE ---
        function listenToDB(id) {
            db.collection("live_matches").doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    match = { ...match, ...data };
                    if(data.t1Logo && (!team1Logo || team1Logo.src !== data.t1Logo)) { team1Logo = new Image(); team1Logo.src = data.t1Logo; }
                    if(data.t2Logo && (!team2Logo || team2Logo.src !== data.t2Logo)) { team2Logo = new Image(); team2Logo.src = data.t2Logo; }
                    if (data.lastAction && data.lastAction.id !== lastActionId) { lastActionId = data.lastAction.id; triggerAnim(data.lastAction.type); }
                }
            });
        }
        function triggerAnim(type) {
            animType = type; animTime = Date.now();
            const a = document.getElementById(type === '4' ? 'audio-four' : type === '6' ? 'audio-six' : type === 'W' ? 'audio-wicket' : null);
            if(a) { a.currentTime = 0; a.play().catch(()=>{}); }
        }

        // --- RENDERER (Resolution Independent) ---
        function renderLoop() {
            // Use INTERNAL CANVAS RESOLUTION (e.g. 3840x2160), NOT SCREEN SIZE
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.clearRect(0, 0, w, h);
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, w, h);
            }

            if (match.showDismissalCard && match.dismissalData) drawDismissalCard(ctx, w, h);
            else if (match.matchStatus === "COMPLETE" || match.showSummaryOverlay) drawProfessionalSummary(ctx, w, h);
            else { drawNewLayout(ctx, w, h); drawPopups(ctx, w, h); }
            
            requestAnimationFrame(renderLoop);
        }

        // --- GRAPHICS (Unchanged - they scale automatically) ---
        function formatTeamName(n) { if(!n)return "TEAM"; return n.toUpperCase().replace(/\bCRICKET CLUB\b/g,"C.C").replace(/\bCRICKET\b/g,"C.C").replace(/\bCC\b/g,"C.C"); }
        function formatPlayerName(n) { if(!n)return""; const p=n.trim().split(/\s+/); return (p.length>1?(p[0]+" "+p[1].charAt(0)+"."):p[0]).toUpperCase(); }
        function drawRoundRect(c,x,y,w,h,r) { if(w<2*r)r=w/2;if(h<2*r)r=h/2; c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath(); }
        function drawLogo(c,n,i,x,y,s,l) { c.save();c.beginPath();c.arc(x+s/2,y+s/2,s/2,0,Math.PI*2);c.fillStyle="white";c.fill();c.clip();if(i)c.drawImage(i,x,y,s,s);else{c.fillStyle="#334155";c.fillRect(x,y,s,s);c.fillStyle="white";c.textAlign="center";c.textBaseline="middle";c.font=`bold ${s*0.5}px 'Roboto'`;c.fillText(n.substring(0,2),x+s/2,y+s/2);}c.restore(); }
        function fitText(c,t,x,y,mw,ifs,w,f) { let fs=ifs;c.font=`${w} ${fs}px '${f}'`;while(c.measureText(t).width>mw&&fs>ifs*0.5){fs-=2;c.font=`${w} ${fs}px '${f}'`;}c.fillText(t,x,y); }
        function drawBallSquare(c,b,x,y,s) { let t=b.toString(),bg="#fff",tc="#000"; if(t==='4'){bg="#0ea5e9";tc="#fff";}else if(t==='6'){bg="#22c55e";tc="#fff";}else if(t.includes('W')&&!t.includes('WD')){bg="#dc2626";tc="#fff";}else if(t==='0'||t==='•'){t="•";bg="#fff";tc="#000";} c.save();c.fillStyle=bg;c.fillRect(x,y,s,s);if(t==="•"){c.fillStyle="black";c.beginPath();c.arc(x+s/2,y+s/2,s*0.18,0,Math.PI*2);c.fill();}else{c.fillStyle=tc;c.textAlign="center";c.textBaseline="middle";c.font=(t.includes('+')||t.length>2)?`900 ${s*0.45}px 'Roboto Condensed'`:`900 ${s*0.7}px 'Roboto Condensed'`;c.fillText(t,x+s/2,y+s/2+s*0.05);}c.restore(); }
        function drawPopups(c,w,h) { if(!animType)return; const now=Date.now();if(now-animTime>3000){animType=null;return;}c.save();c.translate(w*0.05,h-(h*0.19));const t=(now-animTime)/300,sc=t<1?(Math.sin(t*Math.PI/2)*1.1):1.0;c.scale(sc,sc);c.textAlign="left";c.textBaseline="bottom";c.font=`400 ${h*0.08}px 'Anton'`;if(animType==='4'){c.fillStyle="#3b82f6";c.fillText("FOUR RUNS",0,0);}else if(animType==='6'){c.fillStyle="#22c55e";c.fillText("SIX RUNS",0,0);}else if(animType==='W'){c.fillStyle="#ef4444";c.fillText("WICKET",0,0);}c.restore(); }
        
        function drawNewLayout(c,w,h) {
            const barH=h*0.095, mx=w*0.03, by=h-barH-(h*0.03), pw=w-(mx*2), px=mx, isChase=(match.target>0);
            c.fillStyle="#fbbf24";c.fillRect(px,by-barH*0.04-2,pw,barH*0.04);
            c.save();c.fillStyle="#05081c";c.shadowColor="rgba(0,0,0,0.5)";c.shadowBlur=10;drawRoundRect(c,px,by,pw,barH,16);c.fill();c.clip();c.restore();
            let x1=px, x2=px+(pw*0.19), x3=px+(pw*0.30), x4=px+(pw*0.58), x5=px+(pw*0.81), xw1=0, xw2=0, bs=x4, be=x5;
            if(isChase){ x2=px+(pw*0.19); x3=px+(pw*0.30); x4=px+(pw*0.53); xw1=x4; xw2=px+(pw*0.63); bs=xw2; be=px+(pw*0.81); x5=be; }
            const dd=(x)=>{c.beginPath();c.moveTo(x,by+5);c.lineTo(x,by+barH-5);c.strokeStyle="rgba(255,255,255,0.8)";c.lineWidth=1.5;c.stroke();};
            dd(x2);dd(x3);dd(x4);if(isChase){dd(xw2);dd(be);}else{dd(x5);}
            const ls=barH*0.7; drawLogo(c,match.t1,team1Logo,x1+15,by+(barH-ls)/2,ls,true);
            c.fillStyle="white";c.textAlign="left";fitText(c,formatTeamName(match.t1),x1+25+ls,by+barH*0.45,(x2-x1)-ls-35,barH*0.35,'700','Roboto Condensed');
            if(isChase){c.fillStyle="#fbbf24";c.font=`900 ${barH*0.25}px 'Roboto Condensed'`;c.fillText(`TARGET ${match.target}`,x1+25+ls,by+barH*0.75);}else{c.fillStyle="#64748b";c.font=`700 ${barH*0.16}px 'Roboto'`;c.fillText("BATTING",x1+25+ls,by+barH*0.70);}
            const sc=x2+(x3-x2)/2;c.textAlign="center";c.fillStyle="#fbbf24";c.font=`900 ${barH*0.55}px 'Anton'`;c.fillText(`${match.score}/${match.wickets}`,sc,by+barH*0.60);c.fillStyle="white";c.font=`700 ${barH*0.18}px 'Roboto'`;c.fillText(`OVERS ${match.overs}.${match.balls}`,sc,by+barH*0.85);
            c.beginPath();c.moveTo(x3+10,by+barH/2);c.lineTo(x4-10,by+barH/2);c.strokeStyle="rgba(255,255,255,0.4)";c.lineWidth=1;c.stroke();

            c.textAlign="right";c.fillStyle="white";c.font=`700 ${barH*0.30}px 'Roboto Condensed'`;c.fillText(bn,be-20,by+barH*0.38);c.textAlign="left";c.fillStyle="#cbd5e1";c.font=`400 ${barH*0.22}px 'Roboto'`;c.fillText(bf,bs+20,by+barH*0.38);
            const bls=match.currentOver||[]; let bsz=barH*0.32, bx=be-20-bsz; [...bls].reverse().forEach(b=>{drawBallSquare(c,b,bx,by+barH*0.58,bsz);bx-=(bsz+5);});
            const fd=isChase?be:x5; drawLogo(c,match.t2,team2Logo,px+pw-15-ls,by+(barH-ls)/2,ls,false);
            c.fillStyle="white";c.textAlign="right";fitText(c,formatTeamName(match.t2),px+pw-25-ls,by+barH*0.45,(px+pw-fd)-ls-35,barH*0.35,'700','Roboto Condensed');

        function drawProfessionalSummary(c,w,h) { /* Uses same percentage math, works in 4K automatically */
            const cw=w*0.82, ch=h*0.72, x=(w-cw)/2, y=(h-ch)/2+(h*0.05), hh=ch*0.18, fh=ch*0.13, tm=Date.now()*0.0015;
            c.save();c.shadowColor="rgba(0,0,0,0.8)";c.shadowBlur=60;const bg=c.createLinearGradient(x,y,x,y+ch);bg.addColorStop(0,"#020617");bg.addColorStop(1,"#1e1b4b");c.fillStyle=bg;drawRoundRect(c,x,y,cw,ch,20);c.fill();
            const bd=c.createLinearGradient(x,y,x+cw,y+ch);bd.addColorStop(0,`hsl(${(tm*30)%360},70%,50%)`);bd.addColorStop(0.5,"#22d3ee");bd.addColorStop(1,`hsl(${(tm*30+180)%360},70%,50%)`);c.lineWidth=4;c.strokeStyle=bd;c.stroke();c.shadowColor="transparent";
            const ls=hh*0.9, lx=x+30, ly=y+(hh-ls)/2;c.save();c.beginPath();c.moveTo(x+20,y);c.lineTo(x+cw-20,y);c.quadraticCurveTo(x+cw,y,x+cw,y+20);c.lineTo(x+cw,y+hh);c.lineTo(x,y+hh);c.lineTo(x,y+20);c.quadraticCurveTo(x,y,x+20,y);c.clip();const hg=c.createLinearGradient(x,y,x,y+hh);hg.addColorStop(0,"rgba(56,189,248,0.2)");hg.addColorStop(1,"rgba(56,189,248,0)");c.fillStyle=hg;c.fill();c.beginPath();c.moveTo(x,y+hh);c.lineTo(x+cw,y+hh);c.strokeStyle="rgba(255,255,255,0.15)";c.lineWidth=2;c.stroke();c.restore();
            drawLogo(c,match.t1,team1Logo,lx,ly,ls,true);const tx=lx+ls+30, mw=cw-(tx-x)-40;c.textAlign="left";c.textBaseline="alphabetic";c.fillStyle="white";c.shadowColor="rgba(0,0,0,0.8)";c.shadowBlur=4;c.shadowOffsetY=2;fitText(c,(match.t1||"TEAM").toUpperCase(),tx,y+hh*0.55,mw,ch*0.08,'900','Roboto Condensed');c.fillStyle="#7dd3fc";c.font=`700 ${ch*0.03}px 'Roboto'`;c.shadowBlur=0;c.shadowOffsetY=0;c.fillText((match.summaryType==="BOWLING")?"BOWLING CARD":"ICC CHAMPIONS TROPHY",tx,y+hh*0.85);
            const sy=y+hh+(ch*0.05);c.fillStyle="#94a3b8";c.font=`bold ${ch*0.028}px 'Roboto'`;c.textAlign="left";let dl=[];
            if(match.summaryType==="BOWLING"){const cx={n:x+40,o:x+cw*0.55,m:x+cw*0.65,r:x+cw*0.75,w:x+cw*0.85,e:x+cw*0.95};c.fillText("BOWLER",cx.n,sy);c.textAlign="right";c.fillText("O",cx.o,sy);c.fillText("M",cx.m,sy);c.fillText("R",cx.r,sy);c.fillText("W",cx.w,sy);c.fillText("ECON",cx.e,sy);dl=match.bowlingCard||[];renderRows(c,dl,sy,cw,ch,x,cx,"BOWLING");}
            else{const cx={n:x+40,d:x+cw*0.45,r:x+cw*0.80,b:x+cw*0.95};c.fillText("BATTER",cx.n,sy);c.fillText("DISMISSAL",cx.d,sy);c.textAlign="right";c.fillText("RUNS",cx.r,sy);c.fillText("BALLS",cx.b,sy);dl=match.battingCard||[];renderRows(c,dl,sy,cw,ch,x,cx,"BATTING");}
            const fy=y+ch-fh;c.save();c.beginPath();c.moveTo(x,fy);c.lineTo(x+cw,fy);c.lineTo(x+cw,y+ch-20);c.quadraticCurveTo(x+cw,y+ch,x+cw-20,y+ch);c.lineTo(x+20,y+ch);c.quadraticCurveTo(x,y+ch,x,y+ch-20);c.closePath();c.clip();const fg=c.createLinearGradient(x,fy,x,y+ch);fg.addColorStop(0,"#f1f5f9");fg.addColorStop(1,"#cbd5e1");c.fillStyle=fg;c.fill();c.restore();
            const fty=fy+(fh*0.65);c.fillStyle="#0f172a";c.textBaseline="alphabetic";c.textAlign="left";c.font=`bold ${ch*0.035}px 'Roboto'`;c.fillText("EXTRAS "+(match.extras||0),x+40,fty);c.textAlign="center";c.fillText("OVERS "+match.overs+"."+match.balls,x+cw/2,fty);c.textAlign="right";const sf=`900 ${ch*0.075}px 'Roboto Condensed'`, st=match.score+"-"+match.wickets;c.font=sf;const sw=c.measureText(st).width;c.fillText(st,x+cw-40,fty);c.font=`bold ${ch*0.035}px 'Roboto'`;c.fillText("TOTAL",x+cw-40-sw-20,fty);c.restore();
        }
        function renderRows(c,l,sy,cw,ch,x,cx,m) { let cy=sy+(ch*0.04), rh=ch*0.09; c.save();c.beginPath();c.rect(x,cy,cw,ch*0.55);c.clip();l.forEach((p,i)=>{const ry=cy, ty=ry+(rh*0.65), act=(m==="BATTING"&&p.status.includes("NOT OUT"));if(act){const ag=c.createLinearGradient(x,ry,x+cw,ry);ag.addColorStop(0,"#0ea5e9");ag.addColorStop(1,"#0284c7");c.fillStyle=ag;}else{c.fillStyle=(i%2===0)?"rgba(255,255,255,0.05)":"transparent";}c.fillRect(x,ry,cw,rh);c.fillStyle=act?"white":(m==="BATTING"&&!act?"#94a3b8":"white");c.textAlign="left";c.font=`700 ${ch*0.045}px 'Roboto Condensed'`;c.fillText(p.name.toUpperCase(),cx.n,ty);if(m==="BOWLING"){c.textAlign="right";c.font=`500 ${ch*0.045}px 'Roboto'`;c.fillText(p.o,cx.o,ty);c.fillText(p.m,cx.m,ty);c.fillText(p.r,cx.r,ty);c.font=`900 ${ch*0.05}px 'Roboto'`;c.fillText(p.w,cx.w,ty);c.font=`500 ${ch*0.045}px 'Roboto'`;c.fillText(p.e,cx.e,ty);}else{c.font=`500 ${ch*0.03}px 'Roboto'`;if(act){c.fillStyle="rgba(255,255,255,0.9)";c.fillText("NOT OUT",cx.d,ty);}else{c.fillStyle="#94a3b8";c.fillText(p.status.toLowerCase(),cx.d,ty);}c.textAlign="right";c.font=`900 ${ch*0.055}px 'Roboto'`;c.fillStyle="white";c.fillText(p.runs,cx.r,ty);c.font=`500 ${ch*0.035}px 'Roboto'`;c.fillStyle=act?"white":"#94a3b8";c.fillText(p.balls,cx.b,ty);}cy+=rh;});c.restore(); }
        function drawDismissalCard(c,w,h) { const d=match.dismissalData;if(!d)return;const cw=w*0.85, ch=h*0.22, x=(w-cw)/2, y=h-ch-(h*0.1);c.save();c.shadowColor="rgba(0,0,0,0.8)";c.shadowBlur=30;c.shadowOffsetY=15;const bg=c.createLinearGradient(x,y,x+cw,y);bg.addColorStop(0,"#000");bg.addColorStop(0.2,"#001233");bg.addColorStop(0.8,"#001233");bg.addColorStop(1,"#000");c.fillStyle=bg;drawRoundRect(c,x,y,cw,ch,20);c.fill();c.shadowColor="transparent";const ls=ch*0.85, lx=x+40, ly=y+(ch-ls)/2;c.fillStyle="white";c.beginPath();c.arc(lx+ls/2,ly+ls/2,ls/2,0,Math.PI*2);c.fill();c.fillStyle="#e2e8f0";c.beginPath();c.arc(lx+ls/2,ly+ls/2,ls/2-4,0,Math.PI*2);c.fill();drawLogo(c,"TM",team1Logo,lx+4,ly+4,ls-8,true);const np=d.name.split(" ");let fn="",ln=d.name;if(np.length>1){ln=np.pop();fn=np.join(" ");}const tx=lx+ls+40, ny=y+(ch*0.45);c.textAlign="left";c.textBaseline="alphabetic";c.fillStyle="white";c.font=`400 ${ch*0.35}px 'Roboto'`;c.fillText(fn.toUpperCase(),tx,ny);const fw=c.measureText(fn.toUpperCase()+" ").width;c.font=`900 ${ch*0.35}px 'Roboto'`;c.fillText(ln.toUpperCase(),tx+(fn?fw:0),ny);c.fillStyle="#94a3b8";c.font=`500 ${ch*0.15}px 'Roboto'`;c.fillText(d.howOut,tx,y+(ch*0.7));const bh=ch*0.7, bw=bh*1.8, bx=x+cw-bw-30, by=y+(ch-bh)/2;c.save();const bxg=c.createLinearGradient(bx,by,bx,by+bh);bxg.addColorStop(0,"#3b82f6");bxg.addColorStop(1,"#0f172a");c.fillStyle=bxg;c.strokeStyle="#cbd5e1";c.lineWidth=4;drawRoundRect(c,bx,by,bw,bh,15);c.fill();c.stroke();c.fillStyle="white";c.textAlign="center";c.font=`900 ${bh*0.6}px 'Anton'`;c.fillText(d.score,bx+bw/2,by+bh*0.55);c.font=`500 ${bh*0.2}px 'Roboto'`;c.fillText(`OFF ${d.balls}`,bx+bw/2,by+bh*0.85);c.restore();c.restore(); }

        // --- RECORDING SAVER (Robust) ---
        function toggleRecording() {
            const btn=document.getElementById('rec-button'), dot=document.getElementById('rec-indicator'), txt=document.getElementById('rec-text');
            if(isRecording) {
                recorder.stop(); isRecording=false;
                btn.classList.remove('recording'); dot.style.borderRadius="50%"; txt.innerText="REC";
            } else {
                // High Quality Capture
                const stream = canvas.captureStream(60); 
                if(video.srcObject) { const at=video.srcObject.getAudioTracks(); if(at.length>0) stream.addTrack(at[0]); }
                
                // Select Best MIME Type for device
                let mime = 'video/webm;codecs=vp9';
                if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
                if(MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4'; // Better for iOS
                
                try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 }); } 
                catch(e) { recorder = new MediaRecorder(stream); } // Fallback
                
                chunks=[]; 
                recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
                recorder.onstop = saveVideo; 
                recorder.start();
                isRecording=true;
                btn.classList.add('recording'); dot.style.borderRadius="2px"; txt.innerText="STOP";
            }
        }
        function saveVideo() {
            const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); 
            a.style.display = 'none'; 
            a.href = url;
            const ext = (blob.type.includes('mp4')) ? 'mp4' : 'webm';
            a.download = `Match_Rec_${Date.now()}.${ext}`;
            document.body.appendChild(a); 
            a.click(); 
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }
    </script>
