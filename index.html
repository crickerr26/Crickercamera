<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Broadcast Unit - ICC Elite Layout</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Roboto', sans-serif; }
        
        /* --- MAIN APP MODES --- */
        #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #receiver-container { display:none; position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index: 999; }
        
        /* HIDDEN VIDEO SOURCES */
        #video-source { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 0; 
            opacity: 0; 
        }
        
        /* BROADCAST CANVAS */
        #broadcast-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 2; 
        }

        /* HUD CONTROLS */
        #controls-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none;
        }
        .hud-item { pointer-events: auto; }

        /* GEAR BUTTON */
        #gear-button {
            position: absolute; top: 25px; left: 25px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px);
            transition: transform 0.3s ease, background 0.3s;
            z-index: 100;
        }
        #gear-button:hover { background: rgba(0,0,0,0.8); transform: rotate(90deg); }

        /* SETTINGS MENU */
        #settings-menu {
            display: none; position: absolute; top: 80px; left: 25px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #333;
            border-radius: 8px; z-index: 102; flex-direction: column;
            backdrop-filter: blur(10px); min-width: 160px;
        }
        .s-option {
            padding: 15px 20px; color: #ccc; cursor: pointer;
            font-family: 'Roboto'; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }
        .s-option:last-child { border-bottom: none; }
        .s-option:hover { background: rgba(255,255,255,0.1); color: white; }

        /* QUALITY INDICATOR & MENU */
        #quality-badge {
            position: absolute; top: 25px; left: 85px;
            color: #888; /* Grey Letters */
            font-weight: bold; font-family: 'Roboto Condensed'; font-size: 16px;
            cursor: pointer; z-index: 100;
            padding: 12px; background: rgba(0,0,0,0.4); border-radius: 8px;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
            transition: color 0.3s;
        }
        #quality-badge:hover { color: white; }

        #quality-menu {
            display: none; position: absolute; top: 80px; left: 85px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #333;
            border-radius: 8px; z-index: 101; flex-direction: column;
            backdrop-filter: blur(10px); min-width: 120px;
        }
        .q-option {
            padding: 12px 20px; color: #ccc; cursor: pointer;
            font-family: 'Roboto'; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .q-option:last-child { border-bottom: none; }
        .q-option:hover { background: rgba(255,255,255,0.1); color: white; }

        /* REC BUTTON */
        #rec-button {
            position: absolute; top: 25px; right: 25px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px; border-radius: 50px; color: white;
            font-size: 14px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s;
        }
        
        #rec-indicator { width: 12px; height: 12px; background: #ef4444; border-radius: 50%; transition: all 0.3s; }
        
        /* Recording Active State */
        .recording { background: rgba(220, 38, 38, 0.9) !important; border-color: #ef4444 !important; }
        .recording #rec-indicator { 
            background: white; 
            border-radius: 2px; /* Square for Stop */
            animation: none; 
        }

        /* --- ZOOM CONTROLS --- */
        #zoom-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 200px;
            width: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 25px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s;
            display: none; 
        }

        /* Custom Range Slider Styling (Vertical) */
        input[type=range][orient=vertical] {
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
            width: 8px;
            height: 140px;
            padding: 0 5px;
            background: transparent;
            cursor: pointer;
        }
        
        .zoom-btn {
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            opacity: 0.8;
        }
        .zoom-btn:active { transform: scale(0.9); opacity: 1; }

        /* SETUP SCREEN */
        #setup-screen { position: absolute; inset: 0; z-index: 60; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-field { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fbbf24; font-size: 4rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; width: 320px; padding: 1rem; border-radius: 1rem; outline: none; transition: all 0.3s; font-family: 'Anton', sans-serif; margin-bottom: 2rem; }
        .start-btn { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; border: none; padding: 1rem 4rem; border-radius: 50px; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3); text-transform: uppercase; }
        
        /* MODALS */
        .help-modal { position: absolute; inset: 0; z-index: 70; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
        .modal-card { background: #1e1e1e; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #333; color: white; position: relative; }
        
        .url-box { background: #000; color: #4ade80; font-family: 'Roboto Mono', monospace; padding: 15px; border-radius: 8px; word-break: break-all; margin: 15px 0; border: 1px solid #333; font-size: 0.9rem; }

        /* RECEIVER VIDEO */
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <audio id="audio-four" src="four.mp3" preload="auto"></audio>
    <audio id="audio-six" src="six.mp3" preload="auto"></audio>
    <audio id="audio-wicket" src="wicket.mp3" preload="auto"></audio>

    <div id="setup-screen">
        <h1 style="font-family: 'Anton'; font-size: 3rem; color: white; margin-bottom: 0.5rem; letter-spacing: 2px;">BROADCAST UNIT</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; font-family: 'Roboto';">Enter Match Code</p>
        <input type="text" id="match-id" class="input-field" placeholder="0000" maxlength="4" inputmode="numeric">
        <button onclick="connectToMatch()" class="start-btn">Start Camera</button>
    </div>

    <div id="app-container" style="display: none;">
        <div id="controls-layer">
            
            <div id="gear-button" class="hud-item" onclick="toggleSettingsMenu()">⚙️</div>
            
            <div id="settings-menu" class="hud-item">
                <div class="s-option" onclick="showObsModal(); toggleSettingsMenu()">Wireless OBS Link</div>
                <div class="s-option" onclick="changeMatchId()">New Match</div>
            </div>

            <div id="quality-badge" class="hud-item" onclick="toggleQualityMenu()">1080p</div>
            <div id="quality-menu" class="hud-item">
                <div class="q-option" onclick="selectQuality(2160)">4K (UHD)</div>
                <div class="q-option" onclick="selectQuality(1080)">1080p (FHD)</div>
                <div class="q-option" onclick="selectQuality(720)">720p (HD)</div>
            </div>

            <div id="rec-button" class="hud-item" onclick="toggleRecording()">
                <div id="rec-indicator"></div> 
                <span id="rec-text">REC</span>
            </div>

            <div id="zoom-container" class="hud-item">
                <div class="zoom-btn" onclick="stepZoom(1)">+</div>
                <input type="range" id="zoom-slider" orient="vertical" min="1" max="10" step="0.1" value="1" oninput="applyZoom(this.value)">
                <div class="zoom-btn" onclick="stepZoom(-1)">-</div>
            </div>
        </div>
        
        <video id="video-source" autoplay playsinline muted></video>
        <canvas id="broadcast-canvas"></canvas>
    </div>

    <div id="receiver-container">
        <video id="remote-video" autoplay playsinline controls></video>
        <div style="position:absolute; top:20px; left:20px; color:white; font-family:sans-serif; background:rgba(0,0,0,0.5); padding:10px;">RECEIVER MODE</div>
    </div>

    <div id="obs-modal" class="help-modal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-family: 'Anton'; font-size: 24px; margin-bottom: 15px; color: white;">WIRELESS OBS LINK</h2>
            <p style="margin-bottom:10px; color:#ccc;">Create a direct link to OBS.</p>
            
            <button onclick="startWirelessStream()" id="btn-start-stream" style="width:100%; padding:15px; margin-bottom:15px; background:#2563eb; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">GENERATE CONNECTION CODE</button>

            <div id="obs-instructions" style="display:none; text-align:left;">
                <p style="color:#999; font-size:0.9rem;">Copy this URL into <b>OBS Browser Source</b>:</p>
                <div id="obs-url-display" class="url-box">Generating...</div>
                <button onclick="copyObsUrl()" style="width:100%; padding:10px; background:#333; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">COPY URL</button>
            </div>

            <button onclick="closeObsModal()" style="width:100%; padding:12px; border-radius:8px; border:1px solid #444; background:transparent; color:#ccc; font-weight:bold; margin-top:15px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

<script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = { apiKey: "AIzaSyBqcD59IAPpKqk98oDZkgzgkoVZ8b8LGgY", authDomain: "livecricketscoring-92087.firebaseapp.com", databaseURL: "https://livecricketscoring-92087-default-rtdb.firebaseio.com", projectId: "livecricketscoring-92087", storageBucket: "livecricketscoring-92087.firebasestorage.app", messagingSenderId: "522927197627", appId: "1:522927197627:web:f1df5db736cae96893089e" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GLOBAL STATE ---
        let match = { t1: "HOME", t2: "AWAY", score: 0, wickets: 0, overs: 0, balls: 0, striker: { name: "", runs: 0, balls: 0 }, nonStriker: { name: "", runs: 0, balls: 0 }, bowler: { name: "", wkts: 0, runs: 0, balls: 0 }, currentOver: [], target: 0, totalOvers: 20, matchStatus: "", winner: "", margin: "", pom: null, showDismissalCard: false, showSummaryOverlay: false };
        let team1Logo = null, team2Logo = null;
        let lastActionId = null, animType = null, animTime = 0;
        
        // PRELOAD CRICKERR LOGO
        let crickerrLogoImg = new Image();
        crickerrLogoImg.src = 'crickerrlogo.png';

        const video = document.getElementById('video-source');
        
        // REPLAY VIDEO IS DYNAMIC
        let replayVideo = null; 
        
        const canvas = document.getElementById('broadcast-canvas');
        const ctx = canvas.getContext('2d');
        let recorder, chunks = [], isRecording = false;

        // --- REPLAY VARIABLES (FIXED) ---
        let replayRecorder = null;
        let replayChunks = [];
        let replayHeader = null; // CRITICAL: STORES THE FILE HEADER
        let replayState = "LIVE"; 
        let replayStartTime = 0;
        let replayType = ""; 
        let transitionStartTime = 0;
        let replayBlobUrl = null;
        
        // ZOOM VARIABLES
        let currentStream = null; 
        let videoTrack = null;
        let zoomCapabilities = null;

        // --- PEER JS (Wireless) ---
        let peer = null;
        let myPeerId = null;

        // --- INITIALIZATION ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('obs')) {
                initReceiverMode(params.get('obs'));
                return;
            }
            if(params.has('id')) { document.getElementById('match-id').value = params.get('id'); }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        // --- SMART CAMERA CONNECTION ---
        function connectToMatch() {
            const id = document.getElementById('match-id').value;
            if(!id) return alert("Please enter Match ID");
            
            try { ['audio-four','audio-six','audio-wicket'].forEach(id => document.getElementById(id).load()); } catch(e){}

            startCameraStream(1920, 1080);
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            resizeCanvas();
            requestAnimationFrame(renderLoop);
            listenToDB(id);
        }

        // --- QUALITY CONTROL LOGIC ---
        async function startCameraStream(width, height) {
            if(currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { facingMode: "environment", width: { ideal: width }, height: { ideal: height }, frameRate: { ideal: 60 } }, 
                audio: true 
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                video.muted = true;
                video.play().catch(e => console.error(e));

                startRollingReplayBuffer(stream);

                const actualH = stream.getVideoTracks()[0].getSettings().height;
                const label = actualH > 1080 ? "4K" : (actualH > 720 ? "1080p" : "720p");
                document.getElementById('quality-badge').innerText = label;

                videoTrack = stream.getVideoTracks()[0];
                setupZoom();

            } catch(e) {
                console.error("Camera failed:", e);
                alert("Camera failed to start: " + e.message);
            }
        }

        // --- ROBUST REPLAY BUFFER (FIXED FOR BLACK SCREEN) ---
        function startRollingReplayBuffer(stream) {
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4'; 
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = ''; 
            
            try {
                const options = mimeType ? { mimeType, videoBitsPerSecond: 5000000 } : undefined;
                replayRecorder = new MediaRecorder(stream, options);
                
                replayChunks = [];
                replayHeader = null; // Reset header

                replayRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        // 1. SAVE THE HEADER (First Chunk ever received)
                        if (!replayHeader) {
                            replayHeader = e.data;
                            console.log("Replay Header Captured");
                        } else {
                            // 2. SAVE BODY CHUNKS
                            replayChunks.push(e.data);
                        }

                        // 3. ROLLING BUFFER (Keep approx 15 seconds)
                        // Important: We shift 'replayChunks', but NEVER remove 'replayHeader'
                        if(replayChunks.length > 50) { 
                            replayChunks.shift();
                        }
                    }
                };
                
                // 400ms chunks = smoother playback boundaries than 1000ms
                replayRecorder.start(400); 
                console.log("Replay buffer started (Stable Mode)");

            } catch (e) {
                console.warn("Replay not supported", e);
            }
        }

        function triggerReplay(type) {
            if (!replayRecorder || !replayHeader) {
                console.log("Replay failed: No Header or Recorder not ready");
                return;
            }
            
            console.log("Preparing Replay: " + type);
            replayType = type;
            
            // 1. FORCE LATEST DATA
            replayRecorder.requestData();

            // 2. PAUSE MAIN VIDEO (Saves GPU)
            video.pause();

            // 3. CLEANUP OLD
            if (replayVideo) {
                if(replayBlobUrl) URL.revokeObjectURL(replayBlobUrl);
                replayVideo.remove();
                replayVideo = null;
            }

            // 4. CONSTRUCT BLOB (HEADER + CHUNKS)
            // This fixes the black screen by stitching the Header to the body
            const fullBlob = [replayHeader, ...replayChunks];
            const blob = new Blob(fullBlob, { type: replayHeader.type });
            replayBlobUrl = URL.createObjectURL(blob);

            // 5. CREATE VIDEO ELEMENT
            replayVideo = document.createElement('video');
            replayVideo.id = "replay-source";
            replayVideo.muted = true;
            replayVideo.playsInline = true; 
            // Hide from DOM, draw via Canvas
            replayVideo.style.cssText = "position:absolute; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none;";
            document.body.appendChild(replayVideo);

            replayVideo.src = replayBlobUrl;
            replayVideo.playbackRate = 0.5; // SMOOTH SLOW MOTION

            // 6. WAIT FOR READY (Fixes Wobbly/Stuck Start)
            replayVideo.oncanplay = () => {
                replayVideo.play().then(() => {
                    // Start Animation ONLY when video is actually playing
                    replayState = "TRANSITION_IN";
                    transitionStartTime = Date.now();
                }).catch(e => console.log("Replay Play Error", e));
            };
            
            // Failsafe: If video never loads, cancel replay after 2s
            replayVideo.onerror = () => { cleanupReplay(); };
        }

        function cleanupReplay() {
            // KILL REPLAY VIDEO
            if(replayVideo) {
                replayVideo.pause();
                replayVideo.src = "";
                replayVideo.remove();
                replayVideo = null;
            }
            if(replayBlobUrl) {
                URL.revokeObjectURL(replayBlobUrl);
                replayBlobUrl = null;
            }
            
            // RESUME MAIN VIDEO
            video.play().catch(e => console.log("Resume live video failed", e));
            replayState = "LIVE";

            // CRITICAL FIX: RESET RECORDER FOR NEXT BALL
            // This prevents "stuck" buffers by starting fresh every time
            if(replayRecorder && replayRecorder.state !== "inactive") {
                replayRecorder.stop();
                setTimeout(() => {
                    replayChunks = [];
                    replayHeader = null; // Clear header so we capture a new, fresh one
                    replayRecorder.start(400);
                    console.log("Replay Buffer Reset for Next Ball");
                }, 100);
            }
        }

        // --- MENUS & LOGIC ---
        function toggleQualityMenu() {
            document.getElementById('settings-menu').style.display = 'none'; 
            const menu = document.getElementById('quality-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleSettingsMenu() {
            document.getElementById('quality-menu').style.display = 'none'; 
            const menu = document.getElementById('settings-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function changeMatchId() {
            const newId = prompt("Enter New Match ID:");
            if(newId && newId.trim() !== "") {
                window.location.search = `?id=${newId.trim()}`; 
            }
        }

        function selectQuality(height) {
            document.getElementById('quality-menu').style.display = 'none';
            let w = (height * 16) / 9;
            startCameraStream(w, height);
        }

        function setupZoom() {
            try {
                if (videoTrack.getCapabilities && 'zoom' in videoTrack.getCapabilities()) {
                    const capabilities = videoTrack.getCapabilities();
                    const slider = document.getElementById('zoom-slider');
                    const container = document.getElementById('zoom-container');
                    slider.min = capabilities.zoom.min;
                    slider.max = capabilities.zoom.max;
                    slider.step = 0.1;
                    slider.value = capabilities.zoom.min;
                    container.style.display = 'flex';
                }
            } catch(err) {}
        }

        function applyZoom(val) {
            if (!videoTrack) return;
            videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }).catch(err => console.log(err));
        }

        function stepZoom(direction) {
            const slider = document.getElementById('zoom-slider');
            let newVal = parseFloat(slider.value) + direction;
            if(newVal > parseFloat(slider.max)) newVal = parseFloat(slider.max);
            if(newVal < parseFloat(slider.min)) newVal = parseFloat(slider.min);
            slider.value = newVal;
            applyZoom(newVal);
        }

        // --- WIRELESS OBS ---
        function showObsModal() { document.getElementById('obs-modal').style.display = 'flex'; }
        function closeObsModal() { document.getElementById('obs-modal').style.display = 'none'; }

        function startWirelessStream() {
            if(peer) return; 
            const code = Math.floor(1000 + Math.random() * 9000);
            myPeerId = "match-cam-" + code;
            peer = new Peer(myPeerId);
            peer.on('open', (id) => {
                const baseUrl = window.location.href.split('?')[0];
                const fullUrl = `${baseUrl}?obs=${myPeerId}`;
                document.getElementById('btn-start-stream').style.display = 'none';
                document.getElementById('obs-instructions').style.display = 'block';
                document.getElementById('obs-url-display').innerText = fullUrl;
                const stream = canvas.captureStream(60);
                if(video.srcObject) {
                    const audioTracks = video.srcObject.getAudioTracks();
                    if(audioTracks.length > 0) stream.addTrack(audioTracks[0]);
                }
                peer.on('call', (call) => { call.answer(stream); });
            });
        }

        function copyObsUrl() {
            const txt = document.getElementById('obs-url-display').innerText;
            navigator.clipboard.writeText(txt).then(() => alert("URL Copied!"));
        }

        function initReceiverMode(targetId) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('receiver-container').style.display = 'block';
            const peer = new Peer(); 
            peer.on('open', (id) => {
                const conn = peer.connect(targetId);
                const call = peer.call(targetId, new MediaStream());
                call.on('stream', (remoteStream) => {
                    const vid = document.getElementById('remote-video');
                    vid.srcObject = remoteStream;
                    vid.play();
                });
            });
        }

        // --- DATABASE & TRIGGER LOGIC ---
        function listenToDB(id) {
            db.collection("live_matches").doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    match = { ...match, ...data };
                    if(data.t1Logo && (!team1Logo || team1Logo.src !== data.t1Logo)) { team1Logo = new Image(); team1Logo.src = data.t1Logo; }
                    if(data.t2Logo && (!team2Logo || team2Logo.src !== data.t2Logo)) { team2Logo = new Image(); team2Logo.src = data.t2Logo; }
                    if (data.lastAction && data.lastAction.id !== lastActionId) { 
                        lastActionId = data.lastAction.id;

                        triggerAudio(data.lastAction.type);

                        // 2. Schedule Replay AFTER 4 Seconds (Wait for text anim)

        // --- RENDER LOOP ---
        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            // --- REPLAY STATE MACHINE ---
            
            if (replayState === "LIVE") {
                drawVideoObject(video, w, h);
                drawLiveGraphics(w, h);
            
            } else if (replayState === "TRANSITION_IN") {
                drawVideoObject(video, w, h); // Draw live under transition
                let finished = drawCoolStinger(w, h, "IN"); // FIXED STINGER
                if (finished) {
                    replayState = "PLAYING";
                    if(replayVideo) replayVideo.play().catch(e => {});
                    replayStartTime = Date.now();
                }

            } else if (replayState === "PLAYING") {
                if(replayVideo) drawVideoObject(replayVideo, w, h);
                drawReplayOverlay(w, h); // TEXT
                
                // Play for 15 seconds max OR until video ends
                if ((replayVideo && replayVideo.ended) || (Date.now() - replayStartTime > 15000)) { 
                    replayState = "TRANSITION_OUT";
                    transitionStartTime = Date.now();
                }

            } else if (replayState === "TRANSITION_OUT") {
                drawVideoObject(video, w, h); // Draw live under transition
                let finished = drawCoolStinger(w, h, "OUT");
                if (finished) {
                    cleanupReplay(); // Reset for next time
                }
            }
            
            requestAnimationFrame(renderLoop);
        }

        function drawVideoObject(vidObj, w, h) {
            if (vidObj.readyState >= 2) {
                const vidRatio = vidObj.videoWidth / vidObj.videoHeight;
                const screenRatio = w / h;
                let drawW, drawH, drawX, drawY;
                if (screenRatio > vidRatio) {
                    drawW = w; drawH = w / vidRatio; drawX = 0; drawY = (h - drawH) / 2;
                } else {
                    drawW = h * vidRatio; drawH = h; drawX = (w - drawW) / 2; drawY = 0;
                }
                ctx.drawImage(vidObj, drawX, drawY, drawW, drawH);
            }
        }

        // --- COOL STINGER ANIMATION ---
        function drawCoolStinger(w, h, direction) {
            const now = Date.now();
            const elapsed = now - transitionStartTime;
            const duration = 2500; // 2.5s Total
            let p = elapsed / duration;
            if (p > 1) return true;

            // EaseInOutCubic
            const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
            
            // IMPORTANT: Use restore() to undo transforms, NOT resetTransform()
            ctx.save();
            
            // Calculate Cover Alpha (Hold Phase)
            let coverAlpha = 0;
            if(p < 0.3) coverAlpha = p / 0.3;        // Fade In
            else if(p > 0.7) coverAlpha = (1 - p) / 0.3; // Fade Out
            else coverAlpha = 1;                     // Hold

            if (coverAlpha > 0) {
                // Background
                ctx.fillStyle = `rgba(15, 23, 42, ${coverAlpha})`; 
                ctx.fillRect(0,0,w,h);
                
                // Moving Stripes
                const offset = (ease * w * 1.5) - (w * 0.25);
                
                ctx.beginPath();
                ctx.moveTo(offset, 0);
                ctx.lineTo(offset + (w*0.2), 0);
                ctx.lineTo(offset + (w*0.1), h);
                ctx.lineTo(offset - (w*0.1), h);
                ctx.fillStyle = "rgba(59, 130, 246, 0.6)"; // Blue
                ctx.fill();

                // Logo Pop in Center
                if (coverAlpha > 0.8 && crickerrLogoImg.complete) {
                    const ls = h * 0.4;
                    const pulse = 1 + Math.sin(p * 10) * 0.05;
                    const dW = ls * pulse;
                    const dH = ls * pulse;
                    
                    ctx.shadowColor = "white";
                    ctx.shadowBlur = 20;
                    ctx.drawImage(crickerrLogoImg, (w-dW)/2, (h-dH)/2, dW, dH);
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore(); 
            return false;
        }

        // --- 1. REPLACED DRAW FUNCTION (BROADCAST GRADE) ---
        function drawReplayOverlay(w, h) {
            // --- CONFIGURATION ---
            let text = "", subText = "", color1 = "", color2 = "", shape = "";
            let textOffset = 0; // Optical correction for vertical centering

            if (replayType === '6') {
                text = "6"; subText = "MAXIMUM";
                color1 = "#22c55e"; color2 = "#14532d"; // Emerald Greens
                shape = "HEX";
                textOffset = 0.05;
            } else if (replayType === '4') {
                text = "4"; subText = "BOUNDARY";
                color1 = "#3b82f6"; color2 = "#172554"; // Royal Blues
                shape = "CIRCLE";
                textOffset = 0.05;
            } else if (replayType === 'W') {
                text = "OUT"; subText = "WICKET";
                color1 = "#ef4444"; color2 = "#7f1d1d"; // Deep Reds
                shape = "BOX";
                textOffset = 0.02; // Text is smaller, needs less offset
            } else {
                text = "R"; subText = "REPLAY";
                color1 = "#f59e0b"; color2 = "#78350f"; 
                shape = "CIRCLE";
                textOffset = 0.05;
            }

            // --- ANIMATION MATH ---
            const now = Date.now();
            const elapsed = now - replayStartTime;
            
            // 1. Entrance Delay (Wait for Stinger to finish)
            const animDelay = 300; 
            const animTime = Math.max(0, elapsed - animDelay);
            
            // 2. Scale Physics (Elastic Pop)
            let progress = animTime / 600; 
            let scale = getElasticScale(progress);
            
            // 3. Heartbeat Pulse (Continuous)
            if (progress >= 1) scale = 1 + (Math.sin(now / 400) * 0.02);

            // 4. Sheen Position (Sweeping light effect)
            const sheenPos = (now % 2000) / 2000; // 0 to 1 every 2 seconds

            // --- POSITIONING ---
            const badgeSize = h * 0.16; // 16% of screen height
            
            // Calculate Top of Scoreboard (Yellow Line)
            const barH = h * 0.095;
            const bottomY = h - barH - (h * 0.03); 
            const goldH = barH * 0.04;
            const goldY = bottomY - goldH - 2; 

            // Anchors
            const posX = w * 0.09; 
            // Sit exactly on top of the yellow line with slight padding
            const posY = goldY - (badgeSize / 1.7); 

            ctx.save();
            ctx.translate(posX, posY);
            ctx.scale(scale, scale);

            // --- LAYER 1: DROP SHADOW (Heavy TV Shadow) ---
            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;
            
            // Draw Shape Base for Shadow
            ctx.fillStyle = "black"; // Filler for shadow
            drawBadgeShape(ctx, shape, badgeSize);
            ctx.fill();
            ctx.restore();

            // --- LAYER 2: MAIN GRADIENT BODY ---
            const grad = ctx.createLinearGradient(-badgeSize/2, -badgeSize/2, badgeSize/2, badgeSize/2);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            
            // Draw Shape Body
            drawBadgeShape(ctx, shape, badgeSize);
            ctx.fill();

            // --- LAYER 3: GLOSSY SHEEN (THE PROFESSIONAL TOUCH) ---
            ctx.save();
            drawBadgeShape(ctx, shape, badgeSize);
            ctx.clip(); // Mask everything inside the badge
            
            // Draw moving shine
            const sheenX = (sheenPos * badgeSize * 3) - (badgeSize * 1.5);
            const sheenW = badgeSize * 0.4;
            
            const sheenGrad = ctx.createLinearGradient(sheenX, -badgeSize, sheenX + sheenW, badgeSize);
            sheenGrad.addColorStop(0, "rgba(255,255,255,0)");
            sheenGrad.addColorStop(0.5, "rgba(255,255,255,0.4)"); // Center shine
            sheenGrad.addColorStop(1, "rgba(255,255,255,0)");
            
            ctx.fillStyle = sheenGrad;
            // Skewed rectangle for the shine
            ctx.transform(1, 0, -0.5, 1, 0, 0); 
            ctx.fillRect(sheenX - badgeSize, -badgeSize, sheenW * 2, badgeSize * 2);
            ctx.restore();

            // --- LAYER 4: BORDER STROKE ---
            ctx.strokeStyle = "white";
            ctx.lineWidth = 4;
            drawBadgeShape(ctx, shape, badgeSize);
            ctx.stroke();

            // --- LAYER 5: TYPOGRAPHY ---
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Main Text (6, 4, OUT)
            const fontSize = text.length > 2 ? badgeSize * 0.45 : badgeSize * 0.85;
            ctx.font = `900 ${fontSize}px 'Anton', sans-serif`;
            
            // Text Drop Shadow (Hard Edge)
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            
            ctx.fillText(text, 0, badgeSize * textOffset);
            
            // Reset Shadow for Subtext
            ctx.shadowColor = "transparent";

            // --- LAYER 6: SUBTEXT PILL ---
            const subY = badgeSize * 0.65;
            const pillW = badgeSize * 1.3;
            const pillH = badgeSize * 0.22;
            
            ctx.fillStyle = "#0f172a"; // Dark Slate
            ctx.beginPath();
            ctx.roundRect(-pillW/2, subY, pillW, pillH, 8);
            ctx.fill();
            
            // Gold Border on Pill
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#fbbf24"; // Gold Text
            ctx.font = `700 ${badgeSize * 0.16}px 'Roboto Condensed'`;
            // Optical center for pill text
            ctx.fillText(subText, 0, subY + (pillH/2) + 1);

            // --- LAYER 7: HEADER LABEL ---
            ctx.fillStyle = "white";
            ctx.font = `700 ${badgeSize * 0.14}px 'Roboto'`;
            ctx.shadowColor = "black";
            ctx.shadowBlur = 4;
            ctx.fillText("ACTION REPLAY", 0, -badgeSize * 0.82);

            ctx.restore();
        }

        // --- HELPER: CENTRALIZED SHAPE DRAWING ---
        function drawBadgeShape(ctx, shape, size) {
            ctx.beginPath();
            if (shape === 'HEX') {
                drawPolygon(ctx, 0, 0, size * 0.75, 6);
            } else if (shape === 'CIRCLE') {
                ctx.arc(0, 0, size * 0.70, 0, Math.PI * 2);

                // Slightly tilted aggressive box for "OUT"
                const w = size * 0.8;
                const h = size * 0.5;
                const tilt = size * 0.1;
                ctx.moveTo(-w + tilt, -h);
                ctx.lineTo(w + tilt, -h);
                ctx.lineTo(w - tilt, h);
                ctx.lineTo(-w - tilt, h);
                ctx.closePath();
            }
        }

        // --- HELPER: POLYGON MATH ---
        function drawPolygon(ctx, x, y, radius, sides) {
            if (sides < 3) return;
            const a = (Math.PI * 2) / sides;
            // Rotate hexagon so point is at top
            const rotateOffset = sides === 6 ? Math.PI / 2 : 0; 
            
            ctx.moveTo(x + radius * Math.cos(rotateOffset), y + radius * Math.sin(rotateOffset));
            for (let i = 1; i < sides; i++) {
                ctx.lineTo(x + radius * Math.cos(a * i + rotateOffset), y + radius * Math.sin(a * i + rotateOffset));
            }
            ctx.closePath();
        }

        // --- HELPER: ELASTIC PHYSICS ---
        function getElasticScale(t) {
            if (t <= 0) return 0;
            if (t >= 1) return 1;
            const p = 0.5;
            return Math.pow(2, -10 * t) * Math.sin((t - p / 4) * (2 * Math.PI) / p) + 1;
        }

        function fitText(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) { 
            let fontSize = initialFontSize; 
            c.font = `${weight} ${fontSize}px '${fontFace}'`; 
            let width = c.measureText(text).width; 
            while (width > maxWidth && fontSize > (initialFontSize * 0.5)) { 
                fontSize -= 2;

                width = c.measureText(text).width;

            c.textAlign = "right"; c.font = `900 ${barH * 0.35}px 'Roboto Condensed'`;
            c.fillText(match.striker.runs||0, x4 - batPad - 40, bottomY + barH * 0.40);
            c.font = `400 ${barH * 0.2}px 'Roboto'`; c.fillText(`(${match.striker.balls||0})`, x4 - batPad, bottomY + barH * 0.38);
            c.textAlign = "left"; c.fillStyle = "white"; c.font = `500 ${barH * 0.28}px 'Apple SD Gothic Neo', 'Roboto Condensed'`;
            c.fillText(match.nonStriker.name ? formatPlayerName(match.nonStriker.name) : "NON-STRIKER", x3 + 30, bottomY + barH * 0.88);
            c.textAlign = "right"; c.font = `900 ${barH * 0.35}px 'Roboto Condensed'`;
            c.fillText(match.nonStriker.runs||0, x4 - batPad - 40, bottomY + barH * 0.90);
            c.font = `400 ${barH * 0.2}px 'Roboto'`; c.fillText(`(${match.nonStriker.balls||0})`, x4 - batPad, bottomY + barH * 0.88);
            if (isChasing) {
                const boxW = xToWinEnd - xToWinStart;
                const runsNeeded = Math.max(0, match.target - match.score);
                const totalBalls = match.totalOvers * 6;
                const ballsBowled = (match.overs * 6) + match.balls;
                const ballsRem = Math.max(0, totalBalls - ballsBowled);
                const crr = ballsBowled > 0 ? (match.score / (ballsBowled/6)).toFixed(1) : "0.0";
                const rrr = ballsRem > 0 ? (runsNeeded / (ballsRem/6)).toFixed(1) : "-";
                c.save();
                const winGrad = c.createLinearGradient(xToWinStart, bottomY, xToWinEnd, bottomY);
                winGrad.addColorStop(0, "#1565c0"); winGrad.addColorStop(1, "#0d47a1");
                c.fillStyle = winGrad; c.fillRect(xToWinStart, bottomY, boxW, barH);
                const boxCenter = xToWinStart + boxW/2;
                c.textAlign = "center";
                c.fillStyle = "#dbeafe"; c.font = `700 ${barH * 0.16}px 'Roboto Condensed'`;
                c.fillText("TO WIN", boxCenter, bottomY + barH * 0.20);
                c.fillStyle = "white"; c.font = `900 ${barH * 0.52}px 'Anton'`; 
                c.fillText(`${runsNeeded} - ${ballsRem}`, boxCenter, bottomY + barH * 0.71); 
                c.fillStyle = "white"; c.font = `700 ${barH * 0.19}px 'Roboto Condensed'`; 
                c.fillText(`RR: ${rrr}   CRR: ${crr}`, boxCenter, bottomY + barH * 0.92); 
                c.restore();
            }
            c.beginPath(); c.moveTo(bowlStart + 10, bottomY + barH/2); c.lineTo(bowlEnd - 10, bottomY + barH/2);
            c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 1; c.stroke();
            const bowlPad = 20;
            const bName = match.bowler.name ? formatPlayerName(match.bowler.name) : "BOWLER";
            const bFigs = `${match.bowler.wkts || 0}-${match.bowler.runs || 0} (${match.bowler.balls ? (Math.floor(match.bowler.balls/6) + '.' + (match.bowler.balls%6)) : "0.0"})`;
            c.textAlign = "right"; c.fillStyle = "white"; c.font = `700 ${barH * 0.30}px 'Roboto Condensed'`;
            c.fillText(bName, bowlEnd - bowlPad, bottomY + barH * 0.38);
            c.textAlign = "left"; c.fillStyle = "#cbd5e1"; c.font = `400 ${barH * 0.22}px 'Roboto'`;
            c.fillText(bFigs, bowlStart + bowlPad, bottomY + barH * 0.38);
            const balls = match.currentOver || [];
            const ballGap = 5;
            let ballSize = barH * 0.32;
            const maxBallSectionW = (ballSize + ballGap) * 6;
            if (balls.length > 6) { ballSize = (maxBallSectionW - (ballGap * (balls.length - 1))) / balls.length; }
            const ballY = bottomY + barH * 0.58;
            let ballX = bowlEnd - bowlPad - ballSize;
            const ballsToDraw = [...balls].reverse(); 
            ballsToDraw.forEach(b => { drawBallSquare(c, b, ballX, ballY, ballSize); ballX -= (ballSize + ballGap); });
            const finalDiv = isChasing ? bowlEnd : x5; 
            drawLogo(c, match.t2, team2Logo, xEnd - 15 - logoS, bottomY + (barH - logoS)/2, logoS, false);
            c.fillStyle = "white"; c.textAlign = "right";
            fitText(c, formatTeamName(match.t2), xEnd - 25 - logoS, bottomY + barH * 0.45, (xEnd - finalDiv) - logoS - 35, barH * 0.35, '700', 'Roboto Condensed');
            c.fillStyle = "#64748b"; c.font = `700 ${barH * 0.16}px 'Roboto'`;
            c.fillText("BOWLING", xEnd - 25 - logoS, bottomY + barH * 0.70);
        }

        // --- DRAW: PROFESSIONAL SUMMARY ---
        function drawProfessionalSummary(c, w, h) {
            const cardW = w * 0.82; const cardH = h * 0.72; const x = (w - cardW) / 2; const y = (h - cardH) / 2 + (h * 0.05);
            const headerH = cardH * 0.18; const footerH = cardH * 0.13; const time = Date.now() * 0.0015;
            c.save(); c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 60; c.shadowOffsetY = 20;
            const bgGrad = c.createLinearGradient(x, y, x, y + cardH); bgGrad.addColorStop(0, "#020617"); bgGrad.addColorStop(1, "#1e1b4b");   
            c.fillStyle = bgGrad; drawRoundRect(c, x, y, cardW, cardH, 20); c.fill();
            const borderGrad = c.createLinearGradient(x, y, x + cardW, y + cardH); borderGrad.addColorStop(0, `hsl(${(time * 30) % 360}, 70%, 50%)`); borderGrad.addColorStop(0.5, "#22d3ee"); borderGrad.addColorStop(1, `hsl(${(time * 30 + 180) % 360}, 70%, 50%)`);
            c.lineWidth = 4; c.strokeStyle = borderGrad; c.stroke(); c.shadowColor = "transparent";
            const logoSize = headerH * 0.9; const logoX = x + 30; const logoY = y + (headerH - logoSize) / 2; 
            c.save(); c.beginPath(); c.moveTo(x + 20, y); c.lineTo(x + cardW - 20, y); c.quadraticCurveTo(x + cardW, y, x + cardW, y + 20); c.lineTo(x + cardW, y + headerH); c.lineTo(x, y + headerH); c.lineTo(x, y + 20); c.quadraticCurveTo(x, y, x + 20, y); c.clip();
            const hGrad = c.createLinearGradient(x, y, x, y + headerH); hGrad.addColorStop(0, "rgba(56, 189, 248, 0.2)"); hGrad.addColorStop(1, "rgba(56, 189, 248, 0.0)"); c.fillStyle = hGrad; c.fill();
            c.beginPath(); c.moveTo(x, y+headerH); c.lineTo(x+cardW, y+headerH); c.strokeStyle = "rgba(255,255,255,0.15)"; c.lineWidth = 2; c.stroke(); c.restore();
            drawLogo(c, match.t1, team1Logo, logoX, logoY, logoSize, true);
            const textX = logoX + logoSize + 30; const maxTextW = cardW - (textX - x) - 40; 
            c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "white"; c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 4; c.shadowOffsetY = 2;
            fitText(c, (match.t1 || "TEAM NAME").toUpperCase(), textX, y + headerH * 0.55, maxTextW, cardH * 0.08, '900', 'Roboto Condensed');
            c.fillStyle = "#7dd3fc"; c.font = `700 ${cardH * 0.03}px 'Roboto'`; c.shadowBlur = 0; c.shadowOffsetY = 0; const subTitle = (match.summaryType === "BOWLING") ? "BOWLING CARD" : "ICC CHAMPIONS TROPHY"; c.fillText(subTitle, textX, y + headerH * 0.85);
            const startY = y + headerH + (cardH * 0.05); c.fillStyle = "#94a3b8"; c.font = `bold ${cardH * 0.028}px 'Roboto'`; c.textAlign = "left";
            let dataList = [];
            if (match.summaryType === "BOWLING") {
                const colX = { name: x + 40, o: x + cardW * 0.55, m: x + cardW * 0.65, r: x + cardW * 0.75, w: x + cardW * 0.85, e: x + cardW * 0.95 };
                c.fillText("BOWLER", colX.name, startY); c.textAlign = "right"; c.fillText("O", colX.o, startY); c.fillText("M", colX.m, startY); c.fillText("R", colX.r, startY); c.fillText("W", colX.w, startY); c.fillText("ECON", colX.e, startY);
                dataList = match.bowlingCard || []; renderRows(c, dataList, startY, cardW, cardH, x, colX, "BOWLING");
            } else {
                const colX = { name: x + 40, dismissal: x + cardW * 0.45, runs: x + cardW * 0.80, balls: x + cardW * 0.95 };
                c.fillText("BATTER", colX.name, startY); c.fillText("DISMISSAL", colX.dismissal, startY); c.textAlign = "right"; c.fillText("RUNS", colX.runs, startY); c.fillText("BALLS", colX.balls, startY);
                dataList = match.battingCard || []; renderRows(c, dataList, startY, cardW, cardH, x, colX, "BATTING");
            }
            const footerY = y + cardH - footerH; c.save(); c.beginPath(); c.moveTo(x, footerY); c.lineTo(x + cardW, footerY); c.lineTo(x + cardW, y + cardH - 20); c.quadraticCurveTo(x + cardW, y + cardH, x + cardW - 20, y + cardH); c.lineTo(x + 20, y + cardH); c.quadraticCurveTo(x, y + cardH, x, y + cardH - 20); c.closePath(); c.clip();
            const fGrad = c.createLinearGradient(x, footerY, x, y + cardH); fGrad.addColorStop(0, "#f1f5f9"); fGrad.addColorStop(1, "#cbd5e1"); c.fillStyle = fGrad; c.fill(); c.restore();
            const fTextY = footerY + (footerH * 0.65); c.fillStyle = "#0f172a"; c.textBaseline = "alphabetic"; c.textAlign = "left"; c.font = `bold ${cardH * 0.035}px 'Roboto'`; c.fillText("EXTRAS " + (match.extras || 0), x + 40, fTextY);
            c.textAlign = "center"; c.fillText("OVERS " + match.overs + "." + match.balls, x + cardW/2, fTextY); c.textAlign = "right"; const scoreFont = `900 ${cardH * 0.075}px 'Roboto Condensed'`; const scoreText = match.score + "-" + match.wickets; c.font = scoreFont; const scoreWidth = c.measureText(scoreText).width; c.fillText(scoreText, x + cardW - 40, fTextY); c.font = `bold ${cardH * 0.035}px 'Roboto'`; c.fillText("TOTAL", x + cardW - 40 - scoreWidth - 20, fTextY); c.restore();
        }

        function renderRows(c, list, startY, cardW, cardH, x, colX, mode) {
            let currentY = startY + (cardH * 0.04); const rowH = cardH * 0.09; c.save(); c.beginPath(); c.rect(x, currentY, cardW, cardH * 0.55); c.clip(); 
            list.forEach((p, i) => {
                const rowY = currentY; const textY = rowY + (rowH * 0.65); let isActive = false; if (mode === "BATTING" && p.status.includes("NOT OUT")) isActive = true;
                if (isActive) { const activeGrad = c.createLinearGradient(x, rowY, x + cardW, rowY); activeGrad.addColorStop(0, "#0ea5e9"); activeGrad.addColorStop(1, "#0284c7"); c.fillStyle = activeGrad; } else { c.fillStyle = (i % 2 === 0) ? "rgba(255,255,255,0.05)" : "transparent"; } c.fillRect(x, rowY, cardW, rowH);
                c.fillStyle = isActive ? "white" : (mode === "BATTING" && !isActive ? "#94a3b8" : "white"); c.textAlign = "left"; c.font = `700 ${cardH * 0.045}px 'Roboto Condensed'`; c.fillText(p.name.toUpperCase(), colX.name, textY);
                if (mode === "BOWLING") { c.textAlign = "right"; c.font = `500 ${cardH * 0.045}px 'Roboto'`; c.fillText(p.o, colX.o, textY); c.fillText(p.m, colX.m, textY); c.fillText(p.r, colX.r, textY); c.font = `900 ${cardH * 0.05}px 'Roboto'`; c.fillText(p.w, colX.w, textY); c.font = `500 ${cardH * 0.045}px 'Roboto'`; c.fillText(p.e, colX.e, textY); } 
                else { c.font = `500 ${cardH * 0.03}px 'Roboto'`; if (isActive) { c.fillStyle = "rgba(255,255,255,0.9)"; c.fillText("NOT OUT", colX.dismissal, textY); } else { c.fillStyle = "#94a3b8"; c.fillText(p.status.toLowerCase(), colX.dismissal, textY); } c.textAlign = "right"; c.font = `900 ${cardH * 0.055}px 'Roboto'`; c.fillStyle = "white"; c.fillText(p.runs, colX.runs, textY); c.font = `500 ${cardH * 0.035}px 'Roboto'`; c.fillStyle = isActive ? "white" : "#94a3b8"; c.fillText(p.balls, colX.balls, textY); } currentY += rowH;
            }); c.restore();
        }

        // --- DRAW: DISMISSAL CARD ---
        function drawDismissalCard(c, w, h) {
            const d = match.dismissalData; if(!d) return; const cardW = w * 0.85; const cardH = h * 0.22; const x = (w - cardW) / 2; const y = h - cardH - (h * 0.1);
            c.save(); c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 30; c.shadowOffsetY = 15; const bgGrad = c.createLinearGradient(x, y, x + cardW, y); bgGrad.addColorStop(0, "#000000"); bgGrad.addColorStop(0.2, "#001233"); bgGrad.addColorStop(0.8, "#001233"); bgGrad.addColorStop(1, "#000000"); c.fillStyle = bgGrad; drawRoundRect(c, x, y, cardW, cardH, 20); c.fill(); c.shadowColor = "transparent";
            const logoSize = cardH * 0.85; const logoX = x + 40; const logoY = y + (cardH - logoSize) / 2; c.fillStyle = "white"; c.beginPath(); c.arc(logoX + logoSize/2, logoY + logoSize/2, logoSize/2, 0, Math.PI*2); c.fill(); c.fillStyle = "#e2e8f0"; c.beginPath(); c.arc(logoX + logoSize/2, logoY + logoSize/2, logoSize/2 - 4, 0, Math.PI*2); c.fill(); drawLogo(c, "TM", team1Logo, logoX + 4, logoY + 4, logoSize - 8, true);
            const nameParts = d.name.split(" "); let firstName = ""; let lastName = d.name; if(nameParts.length > 1) { lastName = nameParts.pop(); firstName = nameParts.join(" "); } const textX = logoX + logoSize + 40; const nameY = y + (cardH * 0.45); c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "white"; c.font = `400 ${cardH * 0.35}px 'Roboto'`; c.fillText(firstName.toUpperCase(), textX, nameY); const firstW = c.measureText(firstName.toUpperCase() + " ").width; c.font = `900 ${cardH * 0.35}px 'Roboto'`; c.fillText(lastName.toUpperCase(), textX + (firstName ? firstW : 0), nameY); c.fillStyle = "#94a3b8"; c.font = `500 ${cardH * 0.15}px 'Roboto'`; c.fillText(d.howOut, textX, y + (cardH * 0.7));
            const boxH = cardH * 0.7; const boxW = boxH * 1.8; const boxX = x + cardW - boxW - 30; const boxY = y + (cardH - boxH) / 2; c.save(); const boxGrad = c.createLinearGradient(boxX, boxY, boxX, boxY + boxH); boxGrad.addColorStop(0, "#3b82f6"); boxGrad.addColorStop(1, "#0f172a"); c.fillStyle = boxGrad; c.strokeStyle = "#cbd5e1"; c.lineWidth = 4; drawRoundRect(c, boxX, boxY, boxW, boxH, 15); c.fill(); c.stroke(); c.fillStyle = "white"; c.textAlign = "center"; c.font = `900 ${boxH * 0.6}px 'Anton'`; c.fillText(d.score, boxX + boxW/2, boxY + boxH * 0.55); c.font = `500 ${boxH * 0.2}px 'Roboto'`; c.fillText(`OFF ${d.balls}`, boxX + boxW/2, boxY + boxH * 0.85); c.restore(); c.restore();
        }

        // --- RECORDING (UPDATED FOR MP4 & FIX FREEZE) ---
        function toggleRecording() {
            const btn = document.getElementById('rec-button');
            const dot = document.getElementById('rec-indicator');
            const txt = document.getElementById('rec-text');
            
            if(isRecording) {
                recorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                dot.style.borderRadius = "50%";
                txt.innerText = "REC";
                setTimeout(() => { if(recorder) recorder.stop(); }, 50);
            } else {
                const stream = canvas.captureStream(60); 
                if(video.srcObject) { const audioTracks = video.srcObject.getAudioTracks(); if(audioTracks.length > 0) stream.addTrack(audioTracks[0]); }
                let options = { mimeType: 'video/mp4;codecs=avc1', videoBitsPerSecond: 8000000 };
                if(!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 };
                    if(!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { videoBitsPerSecond: 8000000 }; 
                    }
                }
                try { recorder = new MediaRecorder(stream, options); } catch(e) { recorder = new MediaRecorder(stream); }
                chunks = []; recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
                recorder.onstop = saveVideo; recorder.start();
                isRecording = true;
                btn.classList.add('recording');
                dot.style.borderRadius = "2px";
                txt.innerText = "RECORDING";
            }
        }

        function saveVideo() {
            setTimeout(() => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.style.display = 'none'; 
                a.href = url; 
                a.download = `Match_Rec_${Date.now()}.mp4`; 
                document.body.appendChild(a); 
                a.click(); 
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
            }, 100);
        }
    </script>
