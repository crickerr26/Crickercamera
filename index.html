<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Broadcast Unit - Elite Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@300;400;500;600;700&family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Roboto', sans-serif; }
        
        #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* HIDDEN VIDEO SOURCE */
        #video-source { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 0; 
            opacity: 0; /* Hidden, we draw it to canvas */
        }
        
        /* MAIN BROADCAST CANVAS */
        #broadcast-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 2; 
        }

        /* --- HUD CONTROLS (Overlay on top of canvas) --- */
        #controls-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; transition: opacity 0.3s ease; pointer-events: none;
        }
        .clean-feed #controls-layer { opacity: 0; }
        .hud-item { pointer-events: auto; }

        /* Status Pill */
        #status-pill {
            position: absolute; top: 25px; left: 25px;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            padding: 4px 12px; border-radius: 4px;
            color: white; font-size: 14px; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }
        .live-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1.5s infinite; }

        /* Buttons */
        #rec-button, #fb-button, #yt-button {
            position: absolute; top: 25px; 
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px; border-radius: 50px; color: white;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s;
        }
        #rec-button { right: 25px; }
        #fb-button { right: 130px; background: #1877f2; border-color: transparent; }
        #yt-button { right: 240px; background: #FF0000; border-color: transparent; }

        #rec-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        .recording { background: rgba(220, 38, 38, 0.9) !important; border-color: #ef4444 !important; }
        .recording #rec-dot { animation: pulse 1s infinite; background: white; }

        /* SETUP SCREEN */
        #setup-screen { position: absolute; inset: 0; z-index: 60; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-field { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #60a5fa; font-size: 4rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; width: 320px; padding: 1rem; border-radius: 1rem; outline: none; transition: all 0.3s; font-family: 'Anton', sans-serif; margin-bottom: 2rem; }
        .start-btn { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 1rem 4rem; border-radius: 50px; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3); text-transform: uppercase; }
        
        /* MODALS */
        .help-modal { position: absolute; inset: 0; z-index: 70; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
        .modal-card { background: #1e1e1e; width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #333; color: white; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="audio-four" src="four.mp3" preload="auto"></audio>
    <audio id="audio-six" src="six.mp3" preload="auto"></audio>
    <audio id="audio-wicket" src="wicket.mp3" preload="auto"></audio>

    <div id="setup-screen">
        <h1 style="font-family: 'Anton'; font-size: 3rem; color: white; margin-bottom: 0.5rem; letter-spacing: 2px;">BROADCAST UNIT</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; font-family: 'Roboto';">Enter Match Code</p>
        <input type="text" id="match-id" class="input-field" placeholder="0000" maxlength="4" inputmode="numeric">
        <button onclick="connectToMatch()" class="start-btn">Start Camera</button>
    </div>

    <div id="app-container" style="display: none;">
        <div id="controls-layer">
            <div id="status-pill" class="hud-item"><div class="live-dot"></div> LIVE</div>
            <div id="yt-button" class="hud-item" onclick="showYtHelp()">▶ YT LIVE</div>
            <div id="fb-button" class="hud-item" onclick="showFbHelp()">f FB LIVE</div>
            <div id="rec-button" class="hud-item" onclick="toggleRecording()"><div id="rec-dot"></div> REC</div>
        </div>
        
        <video id="video-source" autoplay playsinline muted></video>
        <canvas id="broadcast-canvas"></canvas>
    </div>

    <div id="fb-help-modal" class="help-modal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-family: 'Anton'; font-size: 24px; margin-bottom: 15px; color: #1877f2;">FACEBOOK LIVE</h2>
            <p style="margin-bottom:20px; color:#ccc;">Select "Screen Share" inside Facebook Live to stream this overlay.</p>
            <div style="display:flex; gap:10px;"><button onclick="closeHelp('fb')" style="flex:1; padding:12px; border-radius:8px; border:none; background:#333; color:white; font-weight:bold;">CLOSE</button><button onclick="proceedToFb()" style="flex:1; padding:12px; border-radius:8px; border:none; background:#1877f2; color:white; font-weight:bold;">GO TO FB</button></div>
        </div>
    </div>
    <div id="yt-help-modal" class="help-modal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-family: 'Anton'; font-size: 24px; margin-bottom: 15px; color: #FF0000;">YOUTUBE LIVE</h2>
            <p style="margin-bottom:20px; color:#ccc;">Use StreamYard (Free) to share this screen to YouTube.</p>
            <div style="display:flex; gap:10px;"><button onclick="closeHelp('yt')" style="flex:1; padding:12px; border-radius:8px; border:none; background:#333; color:white; font-weight:bold;">CLOSE</button><button onclick="proceedToStreamYard()" style="flex:1; padding:12px; border-radius:8px; border:none; background:#FF0000; color:white; font-weight:bold;">OPEN STREAMYARD</button></div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = { apiKey: "AIzaSyBqcD59IAPpKqk98oDZkgzgkoVZ8b8LGgY", authDomain: "livecricketscoring-92087.firebaseapp.com", databaseURL: "https://livecricketscoring-92087-default-rtdb.firebaseio.com", projectId: "livecricketscoring-92087", storageBucket: "livecricketscoring-92087.firebasestorage.app", messagingSenderId: "522927197627", appId: "1:522927197627:web:f1df5db736cae96893089e" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GLOBAL STATE ---
        let match = { 
            t1: "HOME", t2: "AWAY", score: 0, wickets: 0, overs: 0, balls: 0, 
            striker: { name: "", runs: 0, balls: 0 }, 
            nonStriker: { name: "", runs: 0, balls: 0 }, 
            bowler: { name: "", wkts: 0, runs: 0, balls: 0 }, 
            currentOver: [], target: 0, totalOvers: 0, matchStatus: "", winner: "", margin: "", pom: null,
            showDismissalCard: false, showSummaryOverlay: false, dismissalData: null 
        };
        let team1Logo = null, team2Logo = null;
        let lastActionId = null, animType = null, animTime = 0;
        
        const video = document.getElementById('video-source');
        const canvas = document.getElementById('broadcast-canvas');
        const ctx = canvas.getContext('2d');
        let recorder, chunks = [], isRecording = false;

        // --- INITIALIZATION ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('id')) { document.getElementById('match-id').value = params.get('id'); }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        function connectToMatch() {
            const id = document.getElementById('match-id').value;
            if(!id) return alert("Please enter Match ID");
            
            // Unlock Audio context on user interaction
            try {
                document.getElementById('audio-four').load();
                document.getElementById('audio-six').load();
                document.getElementById('audio-wicket').load();
            } catch(e) { console.warn("Audio load warning"); }

            const constraints = { video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true };
            
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                video.srcObject = stream;
                video.play();
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                resizeCanvas();
                requestAnimationFrame(renderLoop);
                listenToDB(id);
            }).catch(e => alert("Camera Error: " + e.message));
        }

        function listenToDB(id) {
            db.collection("live_matches").doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    match = { ...match, ...data };
                    
                    // Preload Logos
                    if(data.t1Logo && (!team1Logo || team1Logo.src !== data.t1Logo)) { team1Logo = new Image(); team1Logo.src = data.t1Logo; }
                    if(data.t2Logo && (!team2Logo || team2Logo.src !== data.t2Logo)) { team2Logo = new Image(); team2Logo.src = data.t2Logo; }
                    
                    // Trigger Animations & Audio
                    if (data.lastAction && data.lastAction.id !== lastActionId) { 
                        lastActionId = data.lastAction.id; 
                        triggerAnim(data.lastAction.type); 
                    }
                }
            });
        }

        function triggerAnim(type) {
            animType = type; animTime = Date.now();
            const audioId = type === '4' ? 'audio-four' : type === '6' ? 'audio-six' : type === 'W' ? 'audio-wicket' : null;
            if (audioId) {
                const audio = document.getElementById(audioId);
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio autoplay blocked by browser policy"));
            }
        }

        // --- RENDER LOOP (The Core Engine) ---
        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            // 1. Draw Camera Feed (Scaled to Cover)
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const vidRatio = video.videoWidth / video.videoHeight;
                const screenRatio = w / h;
                let drawW, drawH, drawX, drawY;
                if (screenRatio > vidRatio) {
                    drawW = w; drawH = w / vidRatio; drawX = 0; drawY = (h - drawH) / 2;
                } else {
                    drawW = h * vidRatio; drawH = h; drawX = (w - drawW) / 2; drawY = 0;
                }
                ctx.drawImage(video, drawX, drawY, drawW, drawH);
            }

            // 2. Draw Graphics Overlay
            if (match.showDismissalCard === true && match.dismissalData) {
                // High Priority: Dismissal Card
                drawDismissalCard(ctx, w, h);
            } 
            else if (match.matchStatus === "COMPLETE" || match.showSummaryOverlay === true) {
                // Medium Priority: Summary Tables
                drawProfessionalSummary(ctx, w, h);
            } 
            else {
                // Standard Game: Scoreboard & Popups
                drawICCScoreboard(ctx, w, h);
                drawPopups(ctx, w, h);
            }
            
            requestAnimationFrame(renderLoop);
        }

        // ==========================================
        // === GRAPHICS LIBRARY (From 8.html) ===
        // ==========================================

        // --- HELPER FUNCTIONS ---
        function formatTeamName(name) { if (!name) return "TEAM"; let formatted = name.toUpperCase(); formatted = formatted.replace(/\bCRICKET CLUB\b/g, "C.C"); formatted = formatted.replace(/\bCRICKET\b/g, "C.C"); formatted = formatted.replace(/\bCC\b/g, "C.C"); return formatted; }
        function formatPlayerName(fullName) { if (!fullName) return ""; const parts = fullName.trim().split(" "); if (parts.length === 1) return parts[0]; return `${parts[0]} ${parts[parts.length - 1].charAt(0)}.`; }
        function drawRoundRect(c, x, y, w, h, r) { if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2; c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
        function drawLogo(c, name, img, x, y, s, isLeft) { c.save(); c.beginPath(); c.arc(x + s/2, y + s/2, s/2, 0, Math.PI*2); c.fillStyle = "white"; c.fill(); c.clip(); if(img) c.drawImage(img, x, y, s, s); else { c.fillStyle = isLeft ? "#059669" : "#dc2626"; c.fillRect(x, y, s, s); c.fillStyle = "white"; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `bold ${s*0.5}px 'Roboto'`; c.fillText(name.substring(0,2), x+s/2, y+s/2); } c.restore(); }
        
        function fitText(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) { 
            let fontSize = initialFontSize; c.font = `${weight} ${fontSize}px '${fontFace}'`; 
            let width = c.measureText(text).width; 
            while (width > maxWidth && fontSize > (initialFontSize * 0.5)) { fontSize -= 2; c.font = `${weight} ${fontSize}px '${fontFace}'`; width = c.measureText(text).width; } 
            c.fillText(text, x, y); 
        }

        function drawBubble(c, b, x, y, r) { let txt = b.toString(); let bgColor = txt === '4' ? "#3b82f6" : txt === '6' ? "#22c55e" : (txt.includes('W') && !txt.includes('WD')) ? "#ef4444" : (txt.includes('WD') || txt.includes('NB')) ? "#fbbf24" : "#f1f5f9"; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = bgColor; c.fill(); c.fillStyle = (bgColor === "#fbbf24" || bgColor === "#f1f5f9") ? "black" : "white"; c.fillText(txt, x, y); }

        function drawPopups(c, w, h) { 
            if (!animType) return; const now = Date.now(); if (now - animTime > 3000) { animType = null; return; } 
            c.save(); const startX = w * 0.05; const startY = h - (h * 0.13) - (h * 0.06); c.translate(startX, startY); 
            const t = (now - animTime) / 300; const scale = t < 1 ? (Math.sin(t * Math.PI/2) * 1.1) : 1.0; 
            c.scale(scale, scale); c.textAlign = "left"; c.textBaseline = "bottom"; 
            const fontSize = h * 0.08; c.font = `400 ${fontSize}px 'Anton'`; 
            if (animType === '4') { c.fillStyle = "#3b82f6"; c.fillText("FOUR RUNS", 0, 0); } 
            else if (animType === '6') { c.fillStyle = "#22c55e"; c.fillText("SIX RUNS", 0, 0); } 
            else if (animType === 'W') { c.fillStyle = "#ef4444"; c.fillText("WICKET", 0, 0); } 
            c.restore(); 
        }

        // --- 1. DRAW: STANDARD LOWER THIRD SCOREBOARD ---
        function drawICCScoreboard(c, w, h) {
            const barH = h * 0.13; const marginX = w * 0.02; const bottomY = h - barH - (h * 0.02); const pillW = w - (marginX * 2); const pillX = marginX;
            c.save(); c.fillStyle = "#05081c"; c.shadowColor = "rgba(0,0,0,0.5)"; c.shadowBlur = 10; drawRoundRect(c, pillX, bottomY, pillW, barH, 12); c.fill();
            c.beginPath(); c.moveTo(pillX + 20, bottomY); c.lineTo(pillX + pillW - 20, bottomY); c.lineWidth = 4; c.strokeStyle = "#fbbf24"; c.stroke(); c.restore();

            const divLeft = pillX + (pillW * 0.22); const divRight = pillX + (pillW * 0.78); const centerX = pillX + (pillW * 0.5);
            const drawVerticalLine = (x) => { c.save(); c.beginPath(); c.moveTo(x, bottomY + (barH * 0.15)); c.lineTo(x, bottomY + (barH * 0.85)); c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 2.5; c.stroke(); c.restore(); };
            drawVerticalLine(divLeft); drawVerticalLine(divRight);

            const logoS = barH * 0.60; const logoY = bottomY + (barH - logoS) / 2;
            
            drawLogo(c, match.t1 || "HOME", team1Logo, pillX + 15, logoY, logoS, true);
            const t1NameX = pillX + 25 + logoS; c.textAlign = "left"; c.fillStyle = "white"; fitText(c, formatTeamName(match.t1 || "HOME"), t1NameX, bottomY + barH * 0.45, (divLeft - t1NameX) - 10, barH * 0.22, '700', 'Anton');
            c.fillStyle = "#94a3b8"; c.font = `700 ${barH * 0.14}px 'Roboto'`; c.fillText("BATTING", t1NameX, bottomY + barH * 0.75);

            drawLogo(c, match.t2 || "AWAY", team2Logo, pillX + pillW - 15 - logoS, logoY, logoS, false);
            const t2NameX = pillX + pillW - 25 - logoS; c.textAlign = "right"; c.fillStyle = "white"; fitText(c, formatTeamName(match.t2 || "AWAY"), t2NameX, bottomY + barH * 0.45, (t2NameX - divRight) - 10, barH * 0.22, '700', 'Anton');
            c.fillStyle = "#94a3b8"; c.font = `700 ${barH * 0.14}px 'Roboto'`; c.fillText("BOWLING", t2NameX, bottomY + barH * 0.75);

            const batX = divLeft + 20; const sName = match.striker && match.striker.name ? formatPlayerName(match.striker.name) : "-"; const nsName = match.nonStriker && match.nonStriker.name ? formatPlayerName(match.nonStriker.name) : "-";
            c.textAlign = "left"; const indSize = barH * 0.08; c.save(); c.beginPath(); c.moveTo(batX, bottomY + barH * 0.38); c.lineTo(batX, bottomY + barH * 0.38 + indSize); c.lineTo(batX + indSize, bottomY + barH * 0.38 + (indSize/2)); c.fillStyle = "white"; c.fill(); c.restore();
            c.fillStyle = "white"; c.font = `700 ${barH*0.19}px 'Roboto'`; const nameWidth = c.measureText(sName).width; c.fillText(sName, batX + indSize + 8, bottomY + barH * 0.45);
            c.fillStyle = "#fbbf24"; c.fillText(`${match.striker?.runs||0} (${match.striker?.balls||0})`, batX + indSize + 8 + nameWidth + 10, bottomY + barH * 0.45);
            c.fillStyle = "#9ca3af"; c.font = `500 ${barH*0.17}px 'Roboto'`; c.fillText(nsName, batX, bottomY + barH * 0.75);
            const nsNameWidth = c.measureText(nsName).width; c.fillText(`${match.nonStriker?.runs||0} (${match.nonStriker?.balls||0})`, batX + nsNameWidth + 10, bottomY + barH * 0.75);

            const bowlX = divRight - 20; c.textAlign = "right"; c.fillStyle = "white"; c.font = `700 ${barH*0.19}px 'Roboto'`; c.fillText(match.bowler && match.bowler.name ? formatPlayerName(match.bowler.name) : "-", bowlX, bottomY + barH * 0.35);
            c.fillStyle = "#9ca3af"; c.font = `500 ${barH*0.14}px 'Roboto'`; c.fillText(`${match.bowler?.wkts||0}-${match.bowler?.runs||0} (${match.bowler?.balls||0})`, bowlX, bottomY + barH * 0.52);

            if (match.currentOver && Array.isArray(match.currentOver)) {
                const balls = match.currentOver; let bubbleR = barH * 0.10; if (balls.length > 6) { bubbleR = (barH * 0.10) * (6 / balls.length); } let spacing = bubbleR * 2.3; let bx = bowlX - bubbleR;
                c.textAlign = "center"; c.textBaseline = "middle"; c.font = `700 ${bubbleR*0.8}px 'Roboto'`; const ballsToDraw = [...balls].reverse();
                ballsToDraw.forEach(b => { drawBubble(c, b, bx, bottomY + barH * 0.78, bubbleR); bx -= spacing; }); c.textBaseline = "alphabetic";
            }

            if (match.target > 0) {
                c.save(); c.beginPath(); c.moveTo(centerX, bottomY + barH * 0.10); c.lineTo(centerX, bottomY + barH * 0.90); c.strokeStyle = "rgba(255,255,255,0.6)"; c.lineWidth = 3; c.stroke(); c.restore();
                const scoreX = centerX - 40; c.textAlign = "right"; c.fillStyle = "#fbbf24"; c.font = `400 ${barH * 0.50}px 'Anton'`; c.fillText(`${match.score}/${match.wickets}`, scoreX, bottomY + barH * 0.55);
                c.fillStyle = "white"; c.font = `500 ${barH*0.14}px 'Roboto'`; c.fillText(`OVERS ${match.overs}.${match.balls}`, scoreX, bottomY + barH * 0.82);
                const targetX = centerX + 40; c.textAlign = "left"; c.fillStyle = "#fbbf24"; c.font = `700 ${barH * 0.15}px 'Roboto'`; c.fillText("TO WIN", targetX, bottomY + barH * 0.25); 
                const runsNeeded = Math.max(0, match.target - match.score); const ballsRem = Math.max(0, (match.totalOvers * 6) - (match.overs * 6 + match.balls));
                const eqY = bottomY + barH * 0.62; c.fillStyle = "#9ca3af"; c.font = `400 ${barH * 0.35}px 'Anton'`; c.fillText(runsNeeded, targetX, eqY);
                const w1 = c.measureText(runsNeeded).width; c.font = `500 ${barH * 0.13}px 'Roboto'`; c.fillText("IN", targetX + w1 + 8, eqY);
                const w2 = c.measureText("IN").width; c.font = `400 ${barH * 0.35}px 'Anton'`; c.fillText(ballsRem, targetX + w1 + w2 + 16, eqY);
                const rrr = ballsRem > 0 ? (runsNeeded / (ballsRem/6)).toFixed(1) : "-";
                c.fillStyle = "#6b7280"; c.font = `500 ${barH * 0.12}px 'Roboto'`; c.fillText(`TARGET ${match.target} • RRR ${rrr}`, targetX, bottomY + barH * 0.82);
            } else {
                c.textAlign = "center"; 
                c.fillStyle = "#fbbf24"; c.font = `400 ${barH * 0.55}px 'Anton'`; 
                c.fillText(`${match.score}/${match.wickets}`, centerX, bottomY + barH * 0.58); 
                c.fillStyle = "white"; c.font = `500 ${barH*0.16}px 'Roboto'`;
                c.fillText(`OVERS ${match.overs}.${match.balls}`, centerX, bottomY + barH * 0.85);
            }
        }

        // --- 2. DRAW: PROFESSIONAL SUMMARY (BATTING & BOWLING CARDS) ---
        function drawProfessionalSummary(c, w, h) {
            const cardW = w * 0.82; const cardH = h * 0.72; const x = (w - cardW) / 2; const y = (h - cardH) / 2 + (h * 0.05);
            const headerH = cardH * 0.18; const footerH = cardH * 0.13; const time = Date.now() * 0.0015;

            // Background & Border
            c.save(); c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 60; c.shadowOffsetY = 20;
            const bgGrad = c.createLinearGradient(x, y, x, y + cardH); bgGrad.addColorStop(0, "#020617"); bgGrad.addColorStop(1, "#1e1b4b");
            c.fillStyle = bgGrad; drawRoundRect(c, x, y, cardW, cardH, 20); c.fill();
            const borderGrad = c.createLinearGradient(x, y, x + cardW, y + cardH); borderGrad.addColorStop(0, `hsl(${(time * 30) % 360}, 70%, 50%)`); borderGrad.addColorStop(0.5, "#22d3ee"); borderGrad.addColorStop(1, `hsl(${(time * 30 + 180) % 360}, 70%, 50%)`);
            c.lineWidth = 4; c.strokeStyle = borderGrad; c.stroke(); c.shadowColor = "transparent";

            // Header
            const logoSize = headerH * 0.9; const logoX = x + 30; const logoY = y + (headerH - logoSize) / 2;
            c.save(); c.beginPath(); c.moveTo(x + 20, y); c.lineTo(x + cardW - 20, y); c.quadraticCurveTo(x + cardW, y, x + cardW, y + 20); c.lineTo(x + cardW, y + headerH); c.lineTo(x, y + headerH); c.lineTo(x, y + 20); c.quadraticCurveTo(x, y, x + 20, y); c.clip();
            const hGrad = c.createLinearGradient(x, y, x, y + headerH); hGrad.addColorStop(0, "rgba(56, 189, 248, 0.2)"); hGrad.addColorStop(1, "rgba(56, 189, 248, 0.0)"); c.fillStyle = hGrad; c.fill(); c.restore();
            drawLogo(c, match.t1, team1Logo, logoX, logoY, logoSize, true);

            const textX = logoX + logoSize + 30; const maxTextW = cardW - (textX - x) - 40;
            c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "white"; c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 4; c.shadowOffsetY = 2;
            fitText(c, (match.t1 || "TEAM NAME").toUpperCase(), textX, y + headerH * 0.55, maxTextW, cardH * 0.08, '900', 'Roboto Condensed');
            c.fillStyle = "#7dd3fc"; c.font = `700 ${cardH * 0.03}px 'Roboto'`; c.shadowBlur = 0; c.shadowOffsetY = 0;
            const subTitle = (match.summaryType === "BOWLING") ? "BOWLING CARD" : "MATCH SUMMARY";
            c.fillText(subTitle, textX, y + headerH * 0.85);

            // Table Content
            const startY = y + headerH + (cardH * 0.05); c.fillStyle = "#94a3b8"; c.font = `bold ${cardH * 0.028}px 'Roboto'`; c.textAlign = "left";
            let dataList = [];

            if (match.summaryType === "BOWLING") {
                const colX = { name: x + 40, o: x + cardW * 0.55, m: x + cardW * 0.65, r: x + cardW * 0.75, w: x + cardW * 0.85, e: x + cardW * 0.95 };
                c.fillText("BOWLER", colX.name, startY); c.textAlign = "right"; c.fillText("O", colX.o, startY); c.fillText("M", colX.m, startY); c.fillText("R", colX.r, startY); c.fillText("W", colX.w, startY); c.fillText("ECON", colX.e, startY);
                dataList = match.bowlingCard || [];
                renderRows(c, dataList, startY, cardW, cardH, x, colX, "BOWLING");
            } else {
                const colX = { name: x + 40, dismissal: x + cardW * 0.45, runs: x + cardW * 0.80, balls: x + cardW * 0.95 };
                c.fillText("BATTER", colX.name, startY); c.fillText("DISMISSAL", colX.dismissal, startY); c.textAlign = "right"; c.fillText("RUNS", colX.runs, startY); c.fillText("BALLS", colX.balls, startY);
                dataList = match.battingCard || [];
                renderRows(c, dataList, startY, cardW, cardH, x, colX, "BATTING");
            }

            // Footer
            const footerY = y + cardH - footerH; c.save(); c.beginPath(); c.moveTo(x, footerY); c.lineTo(x + cardW, footerY); c.lineTo(x + cardW, y + cardH - 20); c.quadraticCurveTo(x + cardW, y + cardH, x + cardW - 20, y + cardH); c.lineTo(x + 20, y + cardH); c.quadraticCurveTo(x, y + cardH, x, y + cardH - 20); c.closePath(); c.clip();
            const fGrad = c.createLinearGradient(x, footerY, x, y + cardH); fGrad.addColorStop(0, "#f1f5f9"); fGrad.addColorStop(1, "#cbd5e1"); c.fillStyle = fGrad; c.fill(); c.restore();
            const fTextY = footerY + (footerH * 0.65); c.fillStyle = "#0f172a"; c.textBaseline = "alphabetic"; c.textAlign = "left"; c.font = `bold ${cardH * 0.035}px 'Roboto'`; c.fillText("EXTRAS " + (match.extras || 0), x + 40, fTextY);
            c.textAlign = "center"; c.fillText("OVERS " + match.overs + "." + match.balls, x + cardW/2, fTextY); c.textAlign = "right"; const scoreFont = `900 ${cardH * 0.075}px 'Roboto Condensed'`; const scoreText = match.score + "-" + match.wickets; c.font = scoreFont; const scoreWidth = c.measureText(scoreText).width; c.fillText(scoreText, x + cardW - 40, fTextY); c.font = `bold ${cardH * 0.035}px 'Roboto'`; c.fillText("TOTAL", x + cardW - 40 - scoreWidth - 20, fTextY); c.restore();
        }

        function renderRows(c, list, startY, cardW, cardH, x, colX, mode) {
            let currentY = startY + (cardH * 0.04); const rowH = cardH * 0.09;
            c.save(); c.beginPath(); c.rect(x, currentY, cardW, cardH * 0.55); c.clip();
            list.forEach((p, i) => {
                const rowY = currentY; const textY = rowY + (rowH * 0.65); let isActive = false;
                if (mode === "BATTING" && p.status.includes("NOT OUT")) isActive = true;
                if (isActive) { const activeGrad = c.createLinearGradient(x, rowY, x + cardW, rowY); activeGrad.addColorStop(0, "#0ea5e9"); activeGrad.addColorStop(1, "#0284c7"); c.fillStyle = activeGrad; } else { c.fillStyle = (i % 2 === 0) ? "rgba(255,255,255,0.05)" : "transparent"; }
                c.fillRect(x, rowY, cardW, rowH); c.fillStyle = isActive ? "white" : (mode === "BATTING" && !isActive ? "#94a3b8" : "white");
                c.textAlign = "left"; c.font = `700 ${cardH * 0.045}px 'Roboto Condensed'`; c.fillText(p.name.toUpperCase(), colX.name, textY);
                if (mode === "BOWLING") {
                    c.textAlign = "right"; c.font = `500 ${cardH * 0.045}px 'Roboto'`; c.fillText(p.o, colX.o, textY); c.fillText(p.m, colX.m, textY); c.fillText(p.r, colX.r, textY); c.font = `900 ${cardH * 0.05}px 'Roboto'`; c.fillText(p.w, colX.w, textY); c.font = `500 ${cardH * 0.045}px 'Roboto'`; c.fillText(p.e, colX.e, textY);
                } else {
                    c.font = `500 ${cardH * 0.03}px 'Roboto'`; if (isActive) { c.fillStyle = "rgba(255,255,255,0.9)"; c.fillText("NOT OUT", colX.dismissal, textY); } else { c.fillStyle = "#94a3b8"; c.fillText(p.status.toLowerCase(), colX.dismissal, textY); }
                    c.textAlign = "right"; c.font = `900 ${cardH * 0.055}px 'Roboto'`; c.fillStyle = "white"; c.fillText(p.runs, colX.runs, textY); c.font = `500 ${cardH * 0.035}px 'Roboto'`; c.fillStyle = isActive ? "white" : "#94a3b8"; c.fillText(p.balls, colX.balls, textY);
                }
                currentY += rowH;
            });
            c.restore();
        }

        // --- 3. DRAW: DISMISSAL CARD ---
        function drawDismissalCard(c, w, h) {
            const d = match.dismissalData; if(!d) return;
            const cardW = w * 0.85; const cardH = h * 0.22; const x = (w - cardW) / 2; const y = h - cardH - (h * 0.1);
            c.save(); c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 30; c.shadowOffsetY = 15;
            const bgGrad = c.createLinearGradient(x, y, x + cardW, y); bgGrad.addColorStop(0, "#000000"); bgGrad.addColorStop(0.2, "#001233"); bgGrad.addColorStop(0.8, "#001233"); bgGrad.addColorStop(1, "#000000");
            c.fillStyle = bgGrad; drawRoundRect(c, x, y, cardW, cardH, 20); c.fill(); c.shadowColor = "transparent";
            const logoSize = cardH * 0.85; const logoX = x + 40; const logoY = y + (cardH - logoSize) / 2;
            c.fillStyle = "white"; c.beginPath(); c.arc(logoX + logoSize/2, logoY + logoSize/2, logoSize/2, 0, Math.PI*2); c.fill();
            c.fillStyle = "#e2e8f0"; c.beginPath(); c.arc(logoX + logoSize/2, logoY + logoSize/2, logoSize/2 - 4, 0, Math.PI*2); c.fill();
            drawLogo(c, "TM", team1Logo, logoX + 4, logoY + 4, logoSize - 8, true);
            const nameParts = d.name.split(" "); let firstName = ""; let lastName = d.name; if(nameParts.length > 1) { lastName = nameParts.pop(); firstName = nameParts.join(" "); }
            const textX = logoX + logoSize + 40; const nameY = y + (cardH * 0.45); c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "white"; c.font = `400 ${cardH * 0.35}px 'Roboto'`; c.fillText(firstName.toUpperCase(), textX, nameY); const firstW = c.measureText(firstName.toUpperCase() + " ").width; c.font = `900 ${cardH * 0.35}px 'Roboto'`; c.fillText(lastName.toUpperCase(), textX + (firstName ? firstW : 0), nameY);
            c.fillStyle = "#94a3b8"; c.font = `500 ${cardH * 0.15}px 'Roboto'`; c.fillText(d.howOut, textX, y + (cardH * 0.7));
            const boxH = cardH * 0.7; const boxW = boxH * 1.8; const boxX = x + cardW - boxW - 30; const boxY = y + (cardH - boxH) / 2;
            c.save(); const boxGrad = c.createLinearGradient(boxX, boxY, boxX, boxY + boxH); boxGrad.addColorStop(0, "#3b82f6"); boxGrad.addColorStop(1, "#0f172a"); c.fillStyle = boxGrad; c.strokeStyle = "#cbd5e1"; c.lineWidth = 4; drawRoundRect(c, boxX, boxY, boxW, boxH, 15); c.fill(); c.stroke();
            c.fillStyle = "white"; c.textAlign = "center"; c.font = `900 ${boxH * 0.6}px 'Anton'`; c.fillText(d.score, boxX + boxW/2, boxY + boxH * 0.55); c.font = `500 ${boxH * 0.2}px 'Roboto'`; c.fillText(`OFF ${d.balls}`, boxX + boxW/2, boxY + boxH * 0.85); c.restore(); c.restore();
        }

        // --- SOCIAL LIVE HELPERS ---
        function showFbHelp() { document.getElementById('fb-help-modal').style.display = 'flex'; }
        function showYtHelp() { document.getElementById('yt-help-modal').style.display = 'flex'; }
        function closeHelp(type) { document.getElementById(`${type}-help-modal`).style.display = 'none'; }
        function proceedToFb() { window.open("https://www.facebook.com/live/producer", "_blank"); closeHelp('fb'); }
        function proceedToStreamYard() { window.open("https://streamyard.com/broadcasts", "_blank"); closeHelp('yt'); }

        // --- RECORDING ---
        function toggleRecording() {
            if(isRecording) { recorder.stop(); isRecording = false; document.getElementById('rec-button').classList.remove('recording'); }
            else {
                const stream = canvas.captureStream(60); 
                // Add Audio if available
                if(video.srcObject) { const audioTracks = video.srcObject.getAudioTracks(); if(audioTracks.length > 0) stream.addTrack(audioTracks[0]); }
                let options = { mimeType: 'video/webm;codecs=vp9' };
                if(!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
                try { recorder = new MediaRecorder(stream, options); } catch(e) { console.warn("Fallback Rec"); recorder = new MediaRecorder(stream); }
                chunks = []; recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
                recorder.onstop = saveVideo; recorder.start();
                isRecording = true; document.getElementById('rec-button').classList.add('recording');
            }
        }
        function saveVideo() {
            const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Match_Rec_${Date.now()}.webm`; 
            document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }
    </script>
