<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Broadcast Unit</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@300;400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Apple SD Gothic Neo', 'Roboto', sans-serif; }
        
        #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #video-source { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 0; 
            opacity: 0; 
        }
        
        #broadcast-canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 2; 
        }

        /* HUD */
        #status-pill {
            position: absolute; top: 25px; left: 25px; z-index: 10;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            padding: 4px 12px; border-radius: 4px;
            color: white; font-size: 14px; font-weight: 900; letter-spacing: 1px;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }
        .live-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1.5s infinite; }

        /* RECORD BUTTON */
        #rec-button {
            position: absolute; top: 25px; right: 25px; z-index: 10;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px; border-radius: 50px; color: white;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s;
        }
        #rec-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        .recording { background: rgba(220, 38, 38, 0.9) !important; border-color: #ef4444 !important; }
        .recording #rec-dot { animation: pulse 1s infinite; background: white; }

        /* FACEBOOK LIVE BUTTON */
        #fb-button {
            position: absolute; top: 25px; right: 130px; z-index: 10;
            background: #1877f2; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px; border-radius: 50px; color: white;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4);
            backdrop-filter: blur(8px); transition: all 0.2s;
        }
        #fb-button:hover { background: #166fe5; transform: scale(1.05); }
        #fb-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; font-size: 14px; }

        #setup-screen { position: absolute; inset: 0; z-index: 50; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-field { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #60a5fa; font-size: 4rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; width: 320px; padding: 1rem; border-radius: 1rem; outline: none; transition: all 0.3s; font-family: 'Anton', sans-serif; margin-bottom: 2rem; }
        .start-btn { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 1rem 4rem; border-radius: 50px; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3); text-transform: uppercase; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1 style="font-family: 'Anton'; font-size: 3rem; color: white; margin-bottom: 0.5rem; letter-spacing: 2px;">BROADCAST UNIT</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; font-family: 'Apple SD Gothic Neo';">Enter Match ID</p>
        <input type="text" id="match-id" class="input-field" placeholder="0000" maxlength="4" inputmode="numeric">
        <button onclick="connectToMatch()" class="start-btn">Start Camera</button>
    </div>

    <div id="app-container" style="display: none;">
        <div id="status-pill"><div class="live-dot"></div> LIVE</div>
        
        <div id="fb-button" onclick="goLive()">
            <div id="fb-icon">f</div> FB LIVE
        </div>

        <div id="rec-button" onclick="toggleRecording()"><div id="rec-dot"></div> REC</div>
        <video id="video-source" autoplay playsinline muted></video>
        <canvas id="broadcast-canvas"></canvas>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBqcD59IAPpKqk98oDZkgzgkoVZ8b8LGgY", authDomain: "livecricketscoring-92087.firebaseapp.com", databaseURL: "https://livecricketscoring-92087-default-rtdb.firebaseio.com", projectId: "livecricketscoring-92087", storageBucket: "livecricketscoring-92087.firebasestorage.app", messagingSenderId: "522927197627", appId: "1:522927197627:web:f1df5db736cae96893089e" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let match = { 
            t1: "HOME", t2: "AWAY", score: 0, wickets: 0, overs: 0, balls: 0, 
            striker: { name: "", runs: 0, balls: 0 }, 
            nonStriker: { name: "", runs: 0, balls: 0 }, 
            bowler: { name: "", wkts: 0, runs: 0, balls: 0 }, 
            currentOver: [], target: 0, totalOvers: 0, matchStatus: "", winner: "", margin: "", pom: null 
        };
        let team1Logo = null, team2Logo = null;
        let lastActionId = null, animType = null, animTime = 0;
        
        const video = document.getElementById('video-source');
        const canvas = document.getElementById('broadcast-canvas');
        const ctx = canvas.getContext('2d');
        let recorder, chunks = [], isRecording = false;

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('id')) { document.getElementById('match-id').value = params.get('id'); connectToMatch(); }
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 100); });
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        function connectToMatch() {
            const id = document.getElementById('match-id').value;
            if(!id) return alert("Please enter Match ID");
            const constraints = { video: { facingMode: "environment", width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: true };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                video.srcObject = stream;
                video.play();
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                resizeCanvas();
                requestAnimationFrame(renderLoop);
                listenToDB(id);
            }).catch(e => alert("Camera Error: " + e.message));
        }

        function listenToDB(id) {
            db.collection("live_matches").doc(id).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    match = { ...match, ...data };
                    if(data.t1Logo && (!team1Logo || team1Logo.src !== data.t1Logo)) { team1Logo = new Image(); team1Logo.src = data.t1Logo; }
                    if(data.t2Logo && (!team2Logo || team2Logo.src !== data.t2Logo)) { team2Logo = new Image(); team2Logo.src = data.t2Logo; }
                    if (data.lastAction && data.lastAction.id !== lastActionId) { lastActionId = data.lastAction.id; triggerAnim(data.lastAction.type); }
                }
            });
        }

        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const vidRatio = video.videoWidth / video.videoHeight;
                const screenRatio = w / h;
                let drawW, drawH, drawX, drawY;
                if (screenRatio > vidRatio) {
                    drawW = w; drawH = w / vidRatio; drawX = 0; drawY = (h - drawH) / 2;
                } else {
                    drawW = h * vidRatio; drawH = h; drawX = (w - drawW) / 2; drawY = 0;
                }
                ctx.drawImage(video, drawX, drawY, drawW, drawH);
            } else {
                ctx.clearRect(0, 0, w, h);
            }
            
            if (match.matchStatus === "COMPLETE") {
                drawMatchSummary(ctx, w, h);
            } else {
                drawICCScoreboard(ctx, w, h);
                drawPopups(ctx, w, h);
            }
            requestAnimationFrame(renderLoop);
        }

        function formatTeamName(name) {
            if (!name) return "TEAM";
            let formatted = name.toUpperCase();
            formatted = formatted.replace(/\bCRICKET CLUB\b/g, "C.C");
            formatted = formatted.replace(/\bCRICKET\b/g, "C.C");
            return formatted;
        }

        function formatPlayerName(fullName) {
            if (!fullName) return "";
            const parts = fullName.trim().split(" ");
            if (parts.length === 1) return parts[0]; 
            const firstName = parts[0];
            const lastInitial = parts[parts.length - 1].charAt(0);
            return `${firstName} ${lastInitial}.`;
        }

        // --- FIXED STRICT GRID LAYOUT ---
        function drawICCScoreboard(c, w, h) {
            const barH = h * 0.14; 
            const marginX = w * 0.02; 
            const bottomY = h - barH - (h * 0.04); 
            const pillW = w - (marginX * 2);
            const pillX = marginX;

            c.save();
            c.fillStyle = "#05081c"; 
            c.shadowColor = "rgba(0,0,0,0.6)"; c.shadowBlur = 12;
            drawRoundRect(c, pillX, bottomY, pillW, barH, 16);
            c.fill();
            
            c.beginPath(); c.moveTo(pillX + 20, bottomY); c.lineTo(pillX + pillW - 20, bottomY);
            c.lineWidth = 5; c.strokeStyle = "#ffcc00"; c.stroke();
            c.restore();

            const divLeft = pillX + (pillW * 0.18);
            const divRight = pillX + (pillW * 0.82);
            const centerX = pillX + (pillW * 0.5);
            
            const drawVerticalLine = (x) => {
                c.beginPath(); c.moveTo(x, bottomY + barH * 0.2); c.lineTo(x, bottomY + barH * 0.8);
                c.strokeStyle = "rgba(255,255,255,0.2)"; c.lineWidth = 1.5; c.stroke();
            };
            drawVerticalLine(divLeft);
            drawVerticalLine(divRight);

            const logoS = barH * 0.55; 
            const logoY = bottomY + (barH - logoS) / 2;

            // 1. LEFT TEAM
            drawLogo(c, match.t1 || "HOME", team1Logo, pillX + 15, logoY, logoS, true);
            const t1NameX = pillX + 20 + logoS;
            c.textAlign = "left"; 
            c.fillStyle = "white"; 
            fitText(c, formatTeamName(match.t1 || "HOME"), t1NameX, bottomY + barH * 0.42, (divLeft - t1NameX) - 5, barH * 0.25, '400', 'Anton');
            c.fillStyle = "#6b7280"; c.font = `700 ${barH * 0.12}px 'Apple SD Gothic Neo'`; 
            c.fillText("BATTING", t1NameX, bottomY + barH * 0.7);

            // 2. RIGHT TEAM
            drawLogo(c, match.t2 || "AWAY", team2Logo, pillX + pillW - 15 - logoS, logoY, logoS, false);
            const t2NameX = pillX + pillW - 20 - logoS;
            c.textAlign = "right"; 
            c.fillStyle = "white"; 
            fitText(c, formatTeamName(match.t2 || "AWAY"), t2NameX, bottomY + barH * 0.42, (t2NameX - divRight) - 5, barH * 0.25, '400', 'Anton');
            c.fillStyle = "#6b7280"; c.font = `700 ${barH * 0.12}px 'Apple SD Gothic Neo'`; 
            c.fillText("BOWLING", t2NameX, bottomY + barH * 0.7);

            // 3. BATTING STATS
            const batX = divLeft + 15; 
            const sName = match.striker && match.striker.name ? formatPlayerName(match.striker.name) : "-";
            const nsName = match.nonStriker && match.nonStriker.name ? formatPlayerName(match.nonStriker.name) : "-";
            const sRuns = match.striker ? match.striker.runs : 0;
            const sBalls = match.striker ? match.striker.balls : 0;
            const nsRuns = match.nonStriker ? match.nonStriker.runs : 0;
            const nsBalls = match.nonStriker ? match.nonStriker.balls : 0;

            c.textAlign = "left";
            c.fillStyle = "white"; c.font = `700 ${barH*0.20}px 'Apple SD Gothic Neo'`; 
            
            const indSize = barH * 0.05; 
            c.save(); c.beginPath(); c.moveTo(batX, bottomY + barH * 0.39); c.lineTo(batX, bottomY + barH * 0.39 + indSize); c.lineTo(batX + indSize, bottomY + barH * 0.39 + (indSize/2)); c.fillStyle = "white"; c.fill(); c.restore();

            const nameWidth = c.measureText(sName).width;
            c.fillText(sName, batX + indSize + 5, bottomY + barH * 0.42);
            
            c.fillStyle = "#ffcc00"; 
            const scoreX = Math.max(batX + indSize + 5 + nameWidth + 12, batX + (pillW*0.07)); 
            c.fillText(`${sRuns} (${sBalls})`, scoreX, bottomY + barH * 0.42);

            c.fillStyle = "#9ca3af"; c.font = `700 ${barH*0.18}px 'Apple SD Gothic Neo'`;
            c.fillText(nsName, batX, bottomY + barH * 0.75);
            c.fillText(`${nsRuns} (${nsBalls})`, batX + (pillW*0.07), bottomY + barH * 0.75);

            // 4. BOWLER STATS
            const bowlX = divRight - 15;
            c.textAlign = "right";
            const bName = match.bowler && match.bowler.name ? formatPlayerName(match.bowler.name) : "-";
            const bWkts = match.bowler ? match.bowler.wkts : 0;
            const bRuns = match.bowler ? match.bowler.runs : 0;
            const bBallsCount = match.bowler ? (match.bowler.balls !== undefined ? match.bowler.balls : 0) : 0;

            c.fillStyle = "white"; c.font = `700 ${barH*0.22}px 'Apple SD Gothic Neo'`;
            c.fillText(bName, bowlX, bottomY + barH * 0.35);
            c.fillStyle = "#9ca3af"; c.font = `500 ${barH*0.14}px 'Apple SD Gothic Neo'`;
            c.fillText(`${bWkts}-${bRuns} (${bBallsCount})`, bowlX, bottomY + barH * 0.52);

            // Bubbles (Smart Resizing)
            if (match.currentOver && Array.isArray(match.currentOver)) {
                const balls = match.currentOver;
                let bubbleR = barH * 0.12; 
                if (balls.length > 6) { bubbleR = (barH * 0.12) * (6 / balls.length); }
                let spacing = bubbleR * 2.2;
                let bx = bowlX - bubbleR;
                
                c.textAlign = "center"; c.textBaseline = "middle";
                c.font = `700 ${bubbleR*0.9}px 'Roboto'`; 

                const ballsToDraw = [...balls].reverse();
                ballsToDraw.forEach(b => { 
                    drawBubble(c, b, bx, bottomY + barH * 0.78, bubbleR); 
                    bx -= spacing; 
                });
                c.textBaseline = "alphabetic";
            }

            // --- 5. CENTER BLOCK ---
            if (match.target > 0) {
                // *** SECOND INNINGS ***
                c.textAlign = "right";
                c.fillStyle = "#ffcc00"; c.font = `400 ${barH * 0.55}px 'Anton'`;
                c.fillText(`${match.score}/${match.wickets}`, centerX - 40, bottomY + barH * 0.65);
                
                c.fillStyle = "white"; c.font = `500 ${barH*0.16}px 'Apple SD Gothic Neo'`;
                c.fillText(`OVERS ${match.overs}.${match.balls}`, centerX - 40, bottomY + barH * 0.85);

                drawVerticalLine(centerX - 10); 

                // --- TARGET BLOCK (ADJUSTED Y) ---
                c.textAlign = "left";
                const startX = centerX + 15; 

                // 1. "TO WIN" (Moved UP)
                c.fillStyle = "#ffcc00"; 
                c.font = `700 ${barH * 0.20}px 'Apple SD Gothic Neo'`;
                c.fillText("TO WIN", startX, bottomY + barH * 0.28); 

                // 2. EQUATION (Moved DOWN)
                let cursorX = startX;
                const runsNeeded = match.target - match.score;
                const ballsBowled = (match.overs * 6) + match.balls;
                const ballsRem = (match.totalOvers * 6) - ballsBowled;
                
                const eqY = bottomY + barH * 0.62; 

                // "22"
                c.fillStyle = "white";
                c.font = `400 ${barH * 0.32}px 'Anton'`; 
                c.fillText(runsNeeded, cursorX, eqY);
                cursorX += c.measureText(runsNeeded).width + 5;

                // "RUNS"
                c.fillStyle = "#9ca3af"; 
                c.font = `700 ${barH * 0.16}px 'Apple SD Gothic Neo'`;
                c.fillText("RUNS", cursorX, eqY);
                cursorX += c.measureText("RUNS").width + 5;

                // "in"
                c.font = `500 ${barH * 0.14}px 'Apple SD Gothic Neo'`;
                c.fillText("in", cursorX, eqY);
                cursorX += c.measureText("in").width + 5;

                // "13"
                c.fillStyle = "white";
                c.font = `400 ${barH * 0.32}px 'Anton'`;
                c.fillText(ballsRem, cursorX, eqY);
                cursorX += c.measureText(ballsRem).width + 5;

                // "BALLS"
                c.fillStyle = "#9ca3af";
                c.font = `700 ${barH * 0.16}px 'Apple SD Gothic Neo'`;
                c.fillText("BALLS", cursorX, eqY);

                // 3. TARGET & RATES
                const crr = ballsBowled > 0 ? (match.score / (ballsBowled/6)).toFixed(1) : "0.0";
                const rrr = ballsRem > 0 ? (runsNeeded / (ballsRem/6)).toFixed(1) : runsNeeded;
                
                c.fillStyle = "#9ca3af"; 
                c.font = `500 ${barH * 0.13}px 'Apple SD Gothic Neo'`;
                c.fillText(`TARGET ${match.target} • CRR ${crr} • RRR ${rrr}`, startX, bottomY + barH * 0.85);

            } else {
                // *** FIRST INNINGS ***
                c.textAlign = "center";
                c.textBaseline = "middle"; 
                c.fillStyle = "#ffcc00"; 
                c.font = `400 ${barH * 0.60}px 'Anton'`; 
                c.fillText(`${match.score}/${match.wickets}`, centerX, bottomY + barH * 0.42);
                
                c.fillStyle = "white"; c.font = `500 ${barH*0.18}px 'Apple SD Gothic Neo'`;
                c.fillText(`OVERS ${match.overs}.${match.balls}`, centerX, bottomY + barH * 0.78);
                c.textBaseline = "alphabetic"; 
            }
        }

        function drawBubble(c, b, x, y, r) {
            let txt = b.toString(); let upper = txt.toUpperCase(); 
            let bgColor = "#f1f5f9"; let txtColor = "#0f172a"; 
            if (txt === '4') { bgColor = "#3b82f6"; txtColor = "white"; }
            else if (txt === '6') { bgColor = "#22c55e"; txtColor = "white"; }
            else if (upper.includes('W') && !upper.includes('WD')) { bgColor = "#ef4444"; txtColor = "white"; }
            else if (upper.includes('WD') || upper.includes('NB')) { bgColor = "#fbbf24"; txtColor = "black"; }
            c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = bgColor; c.fill();
            c.fillStyle = txtColor; c.fillText(txt, x, y);
        }

        function fitTextAlignRight(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) {
            let fontSize = initialFontSize; c.font = `${weight} ${fontSize}px '${fontFace}'`;
            let width = c.measureText(text).width;
            while (width > maxWidth && fontSize > (initialFontSize * 0.6)) { fontSize -= 2; c.font = `${weight} ${fontSize}px '${fontFace}'`; width = c.measureText(text).width; }
            if (width > maxWidth) { while (width > maxWidth && text.length > 0) { text = text.slice(0, -1); width = c.measureText(text + "...").width; } text += "..."; }
            c.fillText(text, x, y);
        }
        function fitText(c, text, x, y, maxWidth, initialFontSize, weight, fontFace) {
            let fontSize = initialFontSize; c.font = `${weight} ${fontSize}px '${fontFace}'`;
            let width = c.measureText(text).width;
            while (width > maxWidth && fontSize > (initialFontSize * 0.6)) { fontSize -= 2; c.font = `${weight} ${fontSize}px '${fontFace}'`; width = c.measureText(text).width; }
            if (width > maxWidth) { while (width > maxWidth && text.length > 0) { text = text.slice(0, -1); width = c.measureText(text + "...").width; } text += "..."; }
            c.fillText(text, x, y);
        }
        function drawLogo(c, name, img, x, y, s, isLeft) {
            c.save(); c.beginPath(); c.arc(x + s/2, y + s/2, s/2, 0, Math.PI*2); c.fillStyle = "white"; c.fill(); c.clip();
            if(img) { c.drawImage(img, x, y, s, s); } else { c.fillStyle = isLeft ? "#059669" : "#dc2626"; c.fillRect(x, y, s, s); c.fillStyle = "white"; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `bold ${s*0.5}px 'Roboto'`; c.fillText(name.substring(0,2), x+s/2, y+s/2); } c.restore();
        }
        function drawRoundRect(c, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
            c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
        }
        function triggerAnim(type) { animType = type; animTime = Date.now(); }
        function drawPopups(c, w, h) {
            if (!animType) return; const now = Date.now(); if (now - animTime > 3000) { animType = null; return; }
            c.save(); const startX = w * 0.05; const startY = h - (h * 0.16) - (h * 0.06); c.translate(startX, startY);
            const t = (now - animTime) / 300; const scale = t < 1 ? (Math.sin(t * Math.PI/2) * 1.1) : 1.0;
            c.scale(scale, scale); c.textAlign = "left"; c.textBaseline = "bottom"; const fontSize = h * 0.08; c.font = `400 ${fontSize}px 'Anton'`;
            if (animType === '4') { c.fillStyle = "#3b82f6"; c.fillText("FOUR RUNS", 0, 0); } else if (animType === '6') { c.fillStyle = "#22c55e"; c.fillText("SIX RUNS", 0, 0); } else if (animType === 'W') { c.fillStyle = "#ef4444"; c.fillText("WICKET", 0, 0); } c.restore();
        }
        function drawMatchSummary(c, w, h) {
            const cardW = w * 0.6; const cardH = h * 0.5; const cardX = (w - cardW) / 2; const cardY = (h - cardH) / 2;
            c.save(); const grad = c.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH); grad.addColorStop(0, "#0f172a"); grad.addColorStop(1, "#1e293b");
            c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 40; drawRoundRect(c, cardX, cardY, cardW, cardH, 20); c.fillStyle = grad; c.fill();
            c.lineWidth = 4; c.strokeStyle = "#fbbf24"; c.stroke(); c.restore();
            c.textAlign = "center"; c.textBaseline = "middle";
            c.fillStyle = "#fbbf24"; c.font = `400 ${cardH * 0.15}px 'Anton'`; c.fillText("MATCH SUMMARY", w/2, cardY + cardH * 0.15);
            c.fillStyle = "white"; c.font = `400 ${cardH * 0.25}px 'Anton'`; c.fillText(match.winner || "MATCH FINISHED", w/2, cardY + cardH * 0.35);
            c.fillStyle = "#94a3b8"; c.font = `700 ${cardH * 0.1}px 'Apple SD Gothic Neo'`; c.fillText(match.margin || "", w/2, cardY + cardH * 0.5);
            if (match.pom) {
                c.beginPath(); c.moveTo(cardX + 50, cardY + cardH * 0.6); c.lineTo(cardX + cardW - 50, cardY + cardH * 0.6);
                c.strokeStyle = "rgba(255,255,255,0.2)"; c.lineWidth = 2; c.stroke();
                c.fillStyle = "#fbbf24"; c.font = `700 ${cardH * 0.08}px 'Apple SD Gothic Neo'`; c.fillText("PLAYER OF THE MATCH", w/2, cardY + cardH * 0.7);
                c.fillStyle = "white"; c.font = `400 ${cardH * 0.15}px 'Anton'`; c.fillText(match.pom.name, w/2, cardY + cardH * 0.82);
                c.fillStyle = "#cbd5e1"; c.font = `500 ${cardH * 0.08}px 'Apple SD Gothic Neo'`; c.fillText(match.pom.stats, w/2, cardY + cardH * 0.92);
            }
        }
        
        // --- FACEBOOK LIVE FIX ---
        function goLive() {
            // Fix for Safari "Too many redirects": Open in a specific named window with dimensions
            const url = "https://www.facebook.com/live/producer";
            const win = window.open(url, "fb_live_window", "width=1280,height=720,menubar=no,toolbar=no,location=no,status=no");
            
            if (win) {
                win.focus();
            } else {
                alert("Please allow popups to open Facebook Live.");
            }
        }

        // --- OPTIMIZED RECORDING ---
        function toggleRecording() {
            if(isRecording) { recorder.stop(); isRecording = false; document.getElementById('rec-button').classList.remove('recording'); }
            else {
                const stream = canvas.captureStream(60); 
                if(video.srcObject) { const audioTracks = video.srcObject.getAudioTracks(); if(audioTracks.length > 0) stream.addTrack(audioTracks[0]); }
                let options = { mimeType: 'video/webm;codecs=h264', videoBitsPerSecond: 12000000 };
                if(!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12000000 }; }
                if(!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm', videoBitsPerSecond: 12000000 }; }
                if(!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/mp4', videoBitsPerSecond: 12000000 }; }
                try { recorder = new MediaRecorder(stream, options); }
                catch(e) { console.warn("Fallback"); recorder = new MediaRecorder(stream); }
                chunks = []; recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
                recorder.onstop = saveVideo; recorder.start();
                isRecording = true; document.getElementById('rec-button').classList.add('recording');
            }
        }
        function saveVideo() {
            const mime = recorder.mimeType; let ext = mime.includes('mp4') ? 'mp4' : 'webm';
            const blob = new Blob(chunks, { type: mime }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `ICC_Broadcast_${Date.now()}.${ext}`; 
            document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }
    </script>
